<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Главная база — капсула</title>

  <style>
    :root {
      /* Новый чистый фон: bg_clean_final.jpg = 1536×1024 */
      --bg-w: 1536;
      --bg-h: 1024;
      --pink: 255, 43, 222;
      --cyan: 0, 229, 255;
      --white: 236, 251, 255;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020611;
      color: rgb(var(--white));
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overscroll-behavior: none;
    }

    button { font: inherit; }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #050712;
      isolation: isolate;
      user-select: none;
      touch-action: manipulation;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 0;
      filter: saturate(1.04) contrast(1.02);
    }

    .ambient {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 56% 50%, rgba(var(--pink), .13), transparent 24%),
        radial-gradient(ellipse at 38% 74%, rgba(var(--cyan), .11), transparent 24%),
        linear-gradient(to bottom, rgba(0,0,0,.10), transparent 35%, rgba(0,0,0,.20));
      mix-blend-mode: screen;
    }

    .object-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /*
      КАПСУЛА — двигать здесь:
      --x: вправо/влево
      --y: вверх/вниз
      --w: размер

      Пример:
      --x: 690;  правее
      --y: 220;  ниже
      --w: 360;  крупнее
    */
    .capsule-btn {
      --x: 650;
      --y: 208;
      --w: 355;
      --rgb: var(--pink);

      position: absolute;
      left: calc(var(--x) / var(--bg-w) * 100%);
      top: calc(var(--y) / var(--bg-h) * 100%);
      width: calc(var(--w) / var(--bg-w) * 100%);
      aspect-ratio: 470 / 586;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      outline: none;
      transform-origin: 50% 66%;
      transition: transform .22s cubic-bezier(.2,.9,.18,1.25), filter .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .capsule-sprite {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      transform: translateZ(0);
      transition: opacity .18s ease, filter .22s ease, transform .22s ease;
    }

    .capsule-static {
      opacity: 1;
      filter:
        drop-shadow(0 18px 24px rgba(0,0,0,.60))
        drop-shadow(0 0 2px rgba(var(--pink), .45));
    }

    .capsule-active {
      opacity: 0;
      filter:
        brightness(1.08)
        saturate(1.18)
        drop-shadow(0 18px 24px rgba(0,0,0,.60))
        drop-shadow(0 0 5px rgba(var(--pink), .95))
        drop-shadow(0 0 18px rgba(var(--pink), .72))
        drop-shadow(0 0 42px rgba(var(--pink), .34));
    }

    .capsule-btn::before {
      content: "";
      position: absolute;
      inset: -10%;
      z-index: -1;
      border-radius: 30px;
      background: radial-gradient(ellipse at 50% 55%, rgba(var(--pink), .46), transparent 62%);
      filter: blur(18px);
      opacity: 0;
      mix-blend-mode: screen;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .capsule-btn::after {
      content: "";
      position: absolute;
      inset: 2% 8%;
      z-index: 3;
      background: linear-gradient(115deg, transparent 12%, rgba(255,255,255,0) 34%, rgba(255,255,255,.58) 48%, rgba(var(--pink), .30) 54%, transparent 72%);
      opacity: 0;
      transform: translateX(-72%) skewX(-10deg);
      filter: blur(.4px);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .capsule-btn:hover,
    .capsule-btn:focus-visible,
    .capsule-btn.is-active {
      transform: translateY(-1.3%) scale(1.035);
      filter:
        drop-shadow(0 0 8px rgba(var(--pink), .95))
        drop-shadow(0 0 24px rgba(var(--pink), .58));
    }

    .capsule-btn:hover .capsule-static,
    .capsule-btn:focus-visible .capsule-static,
    .capsule-btn.is-active .capsule-static {
      opacity: 0;
    }

    .capsule-btn:hover .capsule-active,
    .capsule-btn:focus-visible .capsule-active,
    .capsule-btn.is-active .capsule-active {
      opacity: 1;
      animation: capsuleFloat 1.12s ease-in-out infinite alternate;
    }

    .capsule-btn:hover::before,
    .capsule-btn:focus-visible::before,
    .capsule-btn.is-active::before {
      opacity: 1;
      transform: scale(1.06);
      animation: auraPulse 1.05s ease-in-out infinite alternate;
    }

    .capsule-btn:hover::after,
    .capsule-btn:focus-visible::after,
    .capsule-btn.is-active::after {
      animation: scan .95s ease-out infinite;
    }

    .capsule-label {
      position: absolute;
      left: 68%;
      top: 9%;
      z-index: 5;
      transform: translateX(-50%);
      min-width: max-content;
      padding: 7px 12px 8px;
      border: 1px solid rgba(var(--pink), .65);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(7, 9, 30, .82), rgba(34, 5, 48, .70));
      box-shadow: 0 0 18px rgba(var(--pink), .26), inset 0 0 15px rgba(var(--pink), .10);
      backdrop-filter: blur(10px);
      color: #fff;
      pointer-events: none;
      text-align: left;
      opacity: .96;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .capsule-title {
      display: block;
      color: #fff;
      font-size: clamp(13px, 1.15vw, 18px);
      font-weight: 1000;
      line-height: 1;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(var(--pink), .95);
    }

    .capsule-subtitle {
      display: block;
      margin-top: 4px;
      color: rgba(var(--white), .78);
      font-size: clamp(9px, .78vw, 12px);
      font-weight: 760;
      line-height: 1;
      letter-spacing: .01em;
      text-shadow: 0 0 8px rgba(0,0,0,.70);
    }

    .capsule-arrow {
      display: inline-block;
      margin-left: 8px;
      color: #fff;
      text-shadow: 0 0 10px rgba(var(--pink), .95);
    }

    .capsule-btn:hover .capsule-label,
    .capsule-btn:focus-visible .capsule-label,
    .capsule-btn.is-active .capsule-label {
      transform: translateX(-50%) translateY(-3px);
      border-color: rgba(var(--pink), .98);
      box-shadow: 0 0 20px rgba(var(--pink), .44), inset 0 0 18px rgba(var(--pink), .15);
    }

    .ripple {
      position: absolute;
      z-index: 30;
      width: 24px;
      height: 24px;
      margin: -12px 0 0 -12px;
      border: 2px solid rgba(var(--ripple-rgb), .96);
      border-radius: 999px;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(var(--ripple-rgb), .95));
      animation: ripple .78s ease-out forwards;
    }

    @keyframes capsuleFloat {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-5px) rotate(.2deg); }
    }

    @keyframes auraPulse {
      from { opacity: .60; }
      to { opacity: 1; }
    }

    @keyframes scan {
      from { transform: translateX(-72%) skewX(-10deg); opacity: 0; }
      22% { opacity: .92; }
      to { transform: translateX(72%) skewX(-10deg); opacity: 0; }
    }

    @keyframes ripple {
      from { transform: scale(.55); opacity: 1; }
      to { transform: scale(7); opacity: 0; }
    }

    @media (max-width: 860px), (max-height: 560px) {
      .stage {
        inset: 0;
        width: 100vw;
        height: 100dvh;
      }

      .capsule-label {
        left: 70%;
        top: 8%;
        padding: 6px 10px 7px;
      }
    }
  </style>
</head>

<body>
  <main class="stage" id="stage" aria-label="Главная база">
    <img
      class="bg"
      id="baseBg"
      src="./cyber_base_sprite_assets/bg_clean_final.jpg"
      data-candidates="./cyber_base_sprite_assets/bg_clean_final.jpg|./cyber_base_sprite_assets/bg_clean_final.jpeg|./cyber_base_sprite_assets/bg_clean_final.png"
      alt="Чистый фон базы"
      draggable="false"
    />

    <div class="ambient"></div>

    <section class="object-layer" aria-label="Объекты базы">
      <button
        class="capsule-btn"
        id="capsuleBtn"
        type="button"
        aria-label="Капсула"
        data-name="Капсула"
        data-action="Клонировать · Призвать · Пробудить"
      >
        <img class="capsule-sprite capsule-static" src="./cyber_base_sprite_assets/capsule_static.png" alt="Капсула" draggable="false" />
        <img class="capsule-sprite capsule-active" src="./cyber_base_sprite_assets/capsule_active_clean.png" alt="Капсула активна" draggable="false" />

        <span class="capsule-label">
          <span class="capsule-title">Капсула <span class="capsule-arrow">›</span></span>
          <span class="capsule-subtitle">Клонировать · Призвать · Пробудить</span>
        </span>
      </button>
    </section>
  </main>

  <script>
    const stage = document.getElementById('stage');
    const baseBg = document.getElementById('baseBg');
    const capsuleBtn = document.getElementById('capsuleBtn');

    const bgCandidates = (baseBg.dataset.candidates || '').split('|').filter(Boolean);
    let bgIndex = 0;

    baseBg.addEventListener('error', () => {
      bgIndex += 1;
      if (bgCandidates[bgIndex]) baseBg.src = bgCandidates[bgIndex];
    });

    function activateCapsule(clientX, clientY) {
      capsuleBtn.classList.add('is-active');

      if (Number.isFinite(clientX) && Number.isFinite(clientY)) {
        const rect = stage.getBoundingClientRect();
        const ripple = document.createElement('i');
        ripple.className = 'ripple';
        ripple.style.left = `${clientX - rect.left}px`;
        ripple.style.top = `${clientY - rect.top}px`;
        ripple.style.setProperty('--ripple-rgb', '255, 43, 222');
        stage.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      }

      clearTimeout(capsuleBtn._timer);
      capsuleBtn._timer = setTimeout(() => {
        capsuleBtn.classList.remove('is-active');
      }, 1400);
    }

    capsuleBtn.addEventListener('pointerdown', event => {
      event.stopPropagation();
      activateCapsule(event.clientX, event.clientY);
    });

    capsuleBtn.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateCapsule(NaN, NaN);
      }
    });

    stage.addEventListener('pointerdown', () => {
      capsuleBtn.classList.remove('is-active');
    });
  </script>
</body>
</html>
