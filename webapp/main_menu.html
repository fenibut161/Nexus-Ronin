<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS RONIN — Главная база</title>
  <style>
    :root {
      /* Защитные отступы Telegram для iPhone и ПК */
      --safe-top: max(55px, var(--tg-content-safe-area-inset-top, 55px));
      --safe-bottom: max(12px, var(--tg-content-safe-area-inset-bottom, 12px));
      --safe-left: max(12px, var(--tg-content-safe-area-inset-left, 12px));
      --safe-right: max(12px, var(--tg-content-safe-area-inset-right, 12px));

      --cyan: #00f0ff;
      --pink: #ff007b;
      --gold: #ffd36a;
      --purple: #9d00ff;
      --dark-bg: #050914;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--dark-bg);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* === КОНТЕЙНЕР КОМНАТЫ С ФОНОМ И ИНТЕРАКТИВНЫМИ ЗОНАМИ === */
    .room-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    /* На ПК (широкий экран) .room-stage растягивается на весь экран,
       как и раньше — поведение для десктопа не меняется. */

    .room-bg {
      position: absolute;
      inset: -2%;
      width: 104%;
      height: 104%;
      background-image: url('webapp/assets/images/backgrounds/main_menu_bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.85) contrast(1.1);
      animation: breatheRoom 14s infinite alternate ease-in-out;
    }

    @keyframes breatheRoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    /* === ИНТЕРАКТИВНЫЕ ЗОНЫ (ХОТСПОТЫ), ВСТРОЕННЫЕ ПРЯМО В ОБЪЕКТЫ ФОНА === */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* Пульсирующее свечение поверх объектов на картинке */
    .hotspot-glow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0.6;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }

    /* Метка-название объекта поверх зоны */
    .hotspot-label {
      position: relative;
      z-index: 2;
      background: rgba(5, 9, 20, 0.88);
      border: 1px solid var(--cyan);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      white-space: nowrap;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
      transition: all 0.25s;
    }

    /* Анимации выбора и нажатия на хотспоты */
    .hotspot:hover .hotspot-glow,
    .hotspot:active .hotspot-glow {
      opacity: 1;
      transform: scale(1.04);
    }

    .hotspot:hover .hotspot-label,
    .hotspot:active .hotspot-label {
      transform: translateY(-4px) scale(1.08);
      border-color: #fff;
      box-shadow: 0 0 20px var(--cyan);
    }

    .hotspot:active {
      transform: scale(0.95);
    }

    /* 1. ЗОНА ПРИЗЫВА (Центральная капсула) */
    .hotspot-summon {
      top: 25%;
      left: 38%;
      width: 24%;
      height: 48%;
    }
    .hotspot-summon .hotspot-glow {
      background: radial-gradient(circle, rgba(157, 0, 255, 0.45) 0%, rgba(255, 0, 123, 0.2) 60%, transparent 80%);
      border: 2px solid rgba(157, 0, 255, 0.6);
      box-shadow: inset 0 0 30px rgba(255, 0, 123, 0.6), 0 0 35px rgba(157, 0, 255, 0.5);
      animation: pulseSummon 2.5s infinite;
    }
    .hotspot-summon .hotspot-label {
      border-color: var(--pink);
      color: var(--gold);
    }

    @keyframes pulseSummon {
      0%, 100% { opacity: 0.55; box-shadow: inset 0 0 25px rgba(255, 0, 123, 0.5), 0 0 25px rgba(157, 0, 255, 0.4); }
      50% { opacity: 0.9; box-shadow: inset 0 0 45px rgba(255, 0, 123, 0.9), 0 0 45px rgba(157, 0, 255, 0.8); }
    }

    /* 2. ЗОНА ПОДЗЕМЕЛИЙ (Голографический стол слева) */
    .hotspot-dungeons {
      top: 50%;
      left: 3%;
      width: 32%;
      height: 36%;
    }
    .hotspot-dungeons .hotspot-glow {
      background: radial-gradient(circle, rgba(0, 240, 255, 0.4) 0%, transparent 75%);
      border: 2px solid rgba(0, 240, 255, 0.6);
      box-shadow: inset 0 0 25px rgba(0, 240, 255, 0.5), 0 0 30px rgba(0, 240, 255, 0.4);
      animation: pulseDungeons 3s infinite;
    }
    @keyframes pulseDungeons {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }

    /* 3. ЗОНА ИМПЛАНТОВ (Кресло/стол справа внизу) */
    .hotspot-cyberware {
      top: 52%;
      right: 4%;
      width: 30%;
      height: 35%;
    }
    .hotspot-cyberware .hotspot-glow {
      background: radial-gradient(circle, rgba(255, 211, 106, 0.35) 0%, transparent 75%);
      border: 2px solid rgba(255, 211, 106, 0.5);
      box-shadow: inset 0 0 25px rgba(255, 211, 106, 0.4), 0 0 30px rgba(255, 211, 106, 0.3);
      animation: pulseGold 3.2s infinite;
    }
    .hotspot-cyberware .hotspot-label { border-color: var(--gold); }
    @keyframes pulseGold {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.8; }
    }

    /* 4. ЗОНА БАРА «ПОСЛЕЖИЗНИЕ» (Барная стойка справа сверху) */
    .hotspot-bar {
      top: 18%;
      right: 5%;
      width: 30%;
      height: 32%;
    }
    .hotspot-bar .hotspot-glow {
      background: radial-gradient(circle, rgba(255, 0, 123, 0.35) 0%, transparent 75%);
      border: 2px solid rgba(255, 0, 123, 0.5);
      box-shadow: inset 0 0 25px rgba(255, 0, 123, 0.4), 0 0 30px rgba(255, 0, 123, 0.4);
      animation: pulseBar 2.8s infinite;
    }
    .hotspot-bar .hotspot-label { border-color: var(--pink); }
    @keyframes pulseBar {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.8; }
    }

    /* Виньетка и сканлинии поверх фона */
    .vignette-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 45%, rgba(5, 9, 20, 0.7) 90%, rgba(5, 9, 20, 0.95) 100%);
      pointer-events: none;
    }

    /* === ИНТЕРФЕЙС ПОВЕРХ КОМНАТЫ (HUD) === */
    #uiLayer {
      position: relative;
      z-index: 10;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    }

    /* Разрешаем клики по элементам интерфейса */
    .interactive-ui { pointer-events: auto; }

    /* === ВЕРХНЯЯ ПАНЕЛЬ: ПРОФИЛЬ И ВАЛЮТА === */
    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .player-profile {
      background: rgba(5, 9, 20, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.45);
      border-radius: 10px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .avatar-icon { font-size: 18px; }
    .profile-name { font-size: 12px; font-weight: 800; color: #fff; }
    .profile-level { color: var(--cyan); font-size: 10.5px; background: rgba(0, 240, 255, 0.15); padding: 1px 5px; border-radius: 3px; }

    .currency-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .currency-pill {
      background: rgba(5, 9, 20, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 16px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }

    .plus-btn {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
    }

    /* === БОКОВОЕ МЕНЮ (СЛЕВА) === */
    .side-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 140px;
    }

    .side-btn {
      background: rgba(5, 9, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 3px solid var(--cyan);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .side-btn:hover, .side-btn:active {
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--cyan);
      transform: translateX(3px);
    }
    .tag-new { background: var(--pink); color: #fff; font-size: 8px; padding: 1px 4px; border-radius: 3px; font-weight: 900; }

    /* === НИЖНЯЯ ПАНЕЛЬ: ВКАДКИ И КНОПКА КАМПАНИИ === */
    .bottom-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      width: 100%;
    }

    .nav-bar {
      display: flex;
      gap: 4px;
      background: rgba(5, 9, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 4px;
      backdrop-filter: blur(10px);
    }

    .nav-tab {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 800;
      color: #aaa;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-tab.active { background: rgba(0, 240, 255, 0.22); color: var(--cyan); }
    .nav-tab:active { transform: scale(0.94); }

    /* Кнопка Главной сюжетной кампании */
    .story-btn {
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      border: 2px solid var(--pink);
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 123, 0.65);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
      animation: pulseStory 2s infinite;
    }
    @keyframes pulseStory {
      0%, 100% { box-shadow: 0 0 18px rgba(255, 0, 123, 0.5); }
      50% { box-shadow: 0 0 35px rgba(255, 0, 123, 0.95); }
    }
    .story-btn:active { transform: scale(0.96); }
    .story-title { font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: #fff; text-transform: uppercase; }
    .story-ch { font-size: 13px; font-weight: 800; color: var(--gold); }

    /* =========================================================
       МАСШТАБИРОВАНИЕ ДЛЯ IPHONE И УЗКИХ ЭКРАНОВ (PORTRAIT)
       Все элементы аккуратно подстраиваются, ничего не вылезает!
       ========================================================= */
    @media (max-width: 768px) {
      /* Картинка фона имеет соотношение сторон ~1264:843 (широкий формат).
         На узком телефоне при обычном "cover" края обрезаются и хотспоты
         перестают совпадать с объектами на картинке. Поэтому на мобильном
         .room-stage вписывается в экран с сохранением пропорций картинки
         (letterbox), а свободные полосы сверху/снизу закрашиваются в цвет фона. */
      .room-viewport {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--dark-bg);
        overflow: hidden;
      }
      .room-stage {
        position: relative;
        inset: auto;
        width: min(100vw, calc(100vh * 1264 / 843));
        height: min(100vh, calc(100vw * 843 / 1264));
      }

      .top-hud {
        flex-direction: row;
        align-items: center;
        gap: 6px;
        flex-wrap: nowrap;
      }
      .player-profile { padding: 4px 7px; gap: 5px; }
      .avatar-icon { font-size: 15px; }
      .profile-name { font-size: 10px; }
      .profile-level { font-size: 9px; padding: 1px 4px; }
      .currency-group { justify-content: flex-end; gap: 4px; flex-wrap: nowrap; }
      .currency-pill { flex: 0 0 auto; padding: 3px 6px; font-size: 10px; gap: 3px; }
      .plus-btn { width: 14px; height: 14px; font-size: 10px; }
      #musicBtn { padding: 3px 6px; font-size: 10px; }

      .side-menu { flex-direction: row; flex-wrap: wrap; width: 100%; gap: 4px; }
      .side-btn { flex: 1 1 calc(33% - 4px); justify-content: center; text-align: center; padding: 5px; font-size: 10px; }

      .bottom-hud { flex-direction: column; align-items: stretch; gap: 6px; }
      .nav-bar { justify-content: space-around; width: 100%; }
      .nav-tab { flex: 1; padding: 4px; font-size: 9.5px; }
      .story-btn { align-items: center; text-align: center; padding: 8px 12px; }

      /* На iPhone в вертикальной ориентации хотспоты немного крупнее и удобнее для пальца */
      .hotspot-label { font-size: 10px; padding: 4px 8px; }
    }

    /* === МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ ВЫХОДА === */
    .exit-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 4, 10, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .exit-modal-overlay.open { display: flex; }
    .exit-modal {
      width: min(300px, 82vw);
      background: rgba(8, 12, 24, 0.96);
      border: 1px solid var(--cyan);
      border-radius: 14px;
      padding: 22px 18px 16px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.35), 0 0 70px rgba(157, 0, 255, 0.25);
    }
    .exit-modal-text {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.3px;
      line-height: 1.4;
      margin-bottom: 18px;
    }
    .exit-modal-actions { display: flex; gap: 10px; }
    .exit-modal-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s;
    }
    .exit-modal-btn:active { transform: scale(0.95); }
    .exit-modal-btn.yes {
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      color: #fff;
      border-color: var(--pink);
    }
    .exit-modal-btn.no {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      border-color: rgba(0, 240, 255, 0.5);
    }
  </style>
</head>
<body>

<!-- Аудио плеер музыки главного меню -->
<audio id="bgMusic" loop preload="auto">
  <source src="webapp/assets/audio/music/neon_soul.mp3" type="audio/mpeg">
</audio>

<!-- 1. КОМНАТА С ФОНОМ И ИНТЕРАКТИВНЫМИ ЗОНАМИ (ВСТРОЕНЫ В ОБЪЕКТЫ ФОНА!) -->
<div class="room-viewport">
<div class="room-stage">
  <div class="room-bg" id="bgRoom"></div>
  <div class="vignette-layer"></div>

  <!-- ХОТСПОТ 1: ПРИЗЫВ (Капсула по центру) -->
  <div class="hotspot hotspot-summon" onclick="alert('⚡ Открытие капсулы призыва SSR! Загрузка нейроматрицы агента...')">
    <div class="hotspot-glow"></div>
    <div class="hotspot-label">🧬 ПРИЗЫВ АГЕНТОВ</div>
  </div>

  <!-- ХОТСПОТ 2: ПОДЗЕМЕЛЬЯ (Голографический стол слева) -->
  <div class="hotspot hotspot-dungeons" onclick="alert('🌐 Переход на голографическую карту подземелий: Пустота, Красная Сеть, Неоновые Стоки...')">
    <div class="hotspot-glow"></div>
    <div class="hotspot-label">🌐 ПОДЗЕМЕЛЬЯ</div>
  </div>

  <!-- ХОТСПОТ 3: ИМПЛАНТЫ (Мастерская справа внизу) -->
  <div class="hotspot hotspot-cyberware" onclick="alert('🦾 Мастерская кибер-имплантов: улучшение клинков и брони Ронина...')">
    <div class="hotspot-glow"></div>
    <div class="hotspot-label">🦾 ИМПЛАНТЫ</div>
  </div>

  <!-- ХОТСПОТ 4: БАР «ПОСЛЕЖИЗНИЕ» (Барная стойка справа сверху) -->
  <div class="hotspot hotspot-bar" onclick="alert('🍸 Вход в неоновый бар «Послежизние»: контракты синдикатов и слухи...')">
    <div class="hotspot-glow"></div>
    <div class="hotspot-label">🍸 БАР «ПОСЛЕЖИЗНИЕ»</div>
  </div>
</div>
</div>

<!-- 2. ИНТЕРФЕЙС ПОВЕРХ КОМНАТЫ (HUD) -->
<div id="uiLayer">
  <!-- Верхний HUD -->
  <div class="top-hud interactive-ui">
    <div class="player-profile">
      <span class="avatar-icon">🥷</span>
      <span class="profile-name">Ночная Тень</span>
      <span class="profile-level">УР. 68</span>
      <button onclick="confirmExitGame()" style="background:none; border:none; color:#aaa; cursor:pointer; margin-left:6px;" title="Выйти из игры">🚪</button>
    </div>

    <div class="currency-group">
      <div class="currency-pill">
        <span style="color:var(--cyan);">⚡</span> 120 / 120
        <div class="plus-btn" onclick="alert('Пополнение энергии...')">+</div>
      </div>
      <div class="currency-pill">
        <span style="color:var(--gold);">🪙</span> 2 450 790
        <div class="plus-btn" onclick="alert('Банк кредитов Синдиката...')">+</div>
      </div>
      <div class="currency-pill">
        <span style="color:var(--pink);">💎</span> 8 960
        <div class="plus-btn" onclick="alert('Кристаллы Nexus Core...')">+</div>
      </div>
      <button id="musicBtn" style="background:rgba(5,9,20,0.88); border:1px solid var(--cyan); color:#fff; border-radius:12px; padding:4px 8px; font-size:11px; cursor:pointer;">🔊</button>
    </div>
  </div>

  <!-- Средняя зона: Левое меню -->
  <div class="side-menu interactive-ui">
    <div class="side-btn" onclick="alert('Список миссий Ронина')">
      <span>📋 МИССИИ</span>
    </div>
    <div class="side-btn" onclick="alert('Кибер-пропуск 3 сезона')">
      <span>🔥 ПРОПУСК</span>
      <span class="tag-new">NEW</span>
    </div>
    <div class="side-btn" onclick="alert('Чёрный рынок')">
      <span>🛒 МАГАЗИН</span>
    </div>
    <div class="side-btn" onclick="alert('Инвентарь предметов')">
      <span>🎒 ИНВЕНТАРЬ</span>
    </div>
    <div class="side-btn" onclick="alert('Хроники и база знаний')">
      <span>📚 АРХИВЫ</span>
    </div>
  </div>

  <!-- Нижняя панель навигации и кнопка кампании -->
  <div class="bottom-hud interactive-ui">
    <div class="nav-bar">
      <div class="nav-tab active">
        <span>🏠</span>
        <span>ГЛАВНАЯ</span>
      </div>
      <div class="nav-tab" onclick="alert('Коллекция агентов')">
        <span>👤</span>
        <span>АГЕНТЫ</span>
      </div>
      <div class="nav-tab" onclick="alert('Боевой отряд')">
        <span>🛡️</span>
        <span>ОТРЯД</span>
      </div>
      <div class="nav-tab" onclick="alert('Древо технологий')">
        <span>⚡</span>
        <span>ТЕХНОЛОГИИ</span>
      </div>
      <div class="nav-tab" onclick="alert('Кодекс самурая')">
        <span>📖</span>
        <span>КОДЕКС</span>
      </div>
      <div class="nav-tab" onclick="alert('Альянс корпораций')">
        <span>🏢</span>
        <span>КОРПОРАЦИЯ</span>
      </div>
    </div>

    <button class="story-btn" onclick="alert('Запуск сюжета: Глава 12-5 «Неоновый Шпиль»...')">
      <span class="story-title">🚀 ГЛАВНАЯ КАМПАНИЯ</span>
      <span class="story-ch">ГЛАВА 12-5: Неоновый Шпиль ></span>

  </div>
</div>

<!-- Модальное окно подтверждения выхода из игры -->
<div class="exit-modal-overlay" id="exitModalOverlay">
  <div class="exit-modal">
    <div class="exit-modal-text">Вы точно хотите выйти из игры?</div>
    <div class="exit-modal-actions">
      <button class="exit-modal-btn yes" onclick="doExitGame()">ДА</button>
      <button class="exit-modal-btn no" onclick="closeExitModal()">НЕТ</button>
    </div>
  </div>
</div>

<!-- Официальный скрипт Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram?.WebApp;
  const bgMusic = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  const bgRoom = document.getElementById('bgRoom');
  let isMusicPlaying = false;

  // Инициализация Telegram WebApp
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#050914');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#050914');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }

  // Умный поиск картинки фона
  const bgVariants = [
    'webapp/assets/images/backgrounds/main_menu_bg.jpg',
    './assets/images/backgrounds/main_menu_bg.jpg',
    'assets/images/backgrounds/main_menu_bg.jpg',
    '/webapp/assets/images/backgrounds/main_menu_bg.jpg'
  ];

  function tryLoadMenuBg(vIndex) {
    if (vIndex >= bgVariants.length) return;
    const img = new Image();
    img.onload = () => {
      bgRoom.style.backgroundImage = `url('${bgVariants[vIndex]}')`;
    };
    img.onerror = () => tryLoadMenuBg(vIndex + 1);
    img.src = bgVariants[vIndex];
  }
  tryLoadMenuBg(0);

  // =========================================================================
  // ГАРАНТИРОВАННЫЙ ЗАПУСК МУЗЫКИ НА IPHONE / IOS / ПК
  // Браузеры на iPhone требуют касания экрана для старта аудио.
  // Мы запускаем музыку сразу при загрузке, либо при первом же тапе в любой точке экрана!
  // =========================================================================
  function startAudio() {
    if (!isMusicPlaying) {
      bgMusic.volume = 0.65;
      bgMusic.play().then(() => {
        isMusicPlaying = true;
        musicBtn.textContent = "🔊 МУЗЫКА";
      }).catch(e => {
        console.warn("Аудио ждёт тапа по экрану:", e);
      });
    }
  }

  startAudio();

  // Первый тап в любой точке экрана автоматически включит фоновую музыку на iPhone!
  document.addEventListener('pointerdown', startAudio, { once: true });
  document.addEventListener('touchstart', startAudio, { once: true });

  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isMusicPlaying) {
      bgMusic.pause();
      isMusicPlaying = false;
      musicBtn.textContent = "🔇 ВЫКЛ";
    } else {
      bgMusic.play();
      isMusicPlaying = true;
      musicBtn.textContent = "🔊 МУЗЫКА";
    }
  });

  // =========================================================================
  // ВЫХОД ИЗ ИГРЫ С ПОДТВЕРЖДЕНИЕМ
  // Кнопка 🚪 закрывает саму игру (Telegram Mini App), а не ведёт на загрузочный экран.
  // Используем нативный tg.showConfirm, если он доступен, иначе — своё модальное окно.
  // =========================================================================
  const exitModalOverlay = document.getElementById('exitModalOverlay');

  function confirmExitGame() {
    if (tg && typeof tg.showConfirm === 'function') {
      tg.showConfirm('Вы точно хотите выйти из игры?', (confirmed) => {
        if (confirmed) doExitGame();
      });
    } else {
      exitModalOverlay.classList.add('open');
    }
  }

  function closeExitModal() {
    exitModalOverlay.classList.remove('open');
  }

  function doExitGame() {
    closeExitModal();
    if (tg && typeof tg.close === 'function') {
      tg.close(); // закрывает Telegram Mini App
    } else if (window.close) {
      window.close(); // закрывает вкладку/окно в обычном браузере
    }
  }
</script>
</body>
</html>
