<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyber Base — Main Menu</title>

  <style>
    :root {
      --cyan: 0, 229, 255;
      --pink: 255, 43, 222;
      --gold: 255, 213, 95;
      --violet: 156, 81, 255;
      --bg-w: 1376;
      --bg-h: 768;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #020611;
      color: #ecfbff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 52% 45%, rgba(104, 0, 255, .24), transparent 34%),
        radial-gradient(circle at 18% 82%, rgba(var(--cyan), .16), transparent 30%),
        linear-gradient(135deg, #020611, #070014 52%, #010208);
    }

    button {
      font: inherit;
    }

    .stage {
      position: relative;
      width: min(100vw, 1376px);
      aspect-ratio: 1376 / 768;
      overflow: hidden;
      background: #050712;
      box-shadow: 0 28px 90px rgba(0,0,0,.74), 0 0 70px rgba(var(--pink), .18);
      isolation: isolate;
      user-select: none;
      touch-action: manipulation;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      filter: saturate(1.04) contrast(1.02);
      z-index: 0;
    }

    .ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 47% 51%, rgba(var(--pink), .12), transparent 24%),
        radial-gradient(ellipse at 34% 72%, rgba(var(--cyan), .14), transparent 24%),
        linear-gradient(to bottom, transparent 66%, rgba(0,0,0,.26));
      mix-blend-mode: screen;
      opacity: .9;
      z-index: 1;
    }

    /* =========================================================
       MAIN OBJECT SPRITES
       Фон лежит отдельно, эти объекты — отдельные PNG-спрайты.
       Координаты в системе 1376×768.
       ========================================================= */

    .sprite-btn {
      --x: 0px;
      --y: 0px;
      --w: 200px;
      --rgb: var(--cyan);
      position: absolute;
      left: calc(var(--x) / var(--bg-w) * 100%);
      top: calc(var(--y) / var(--bg-h) * 100%);
      width: calc(var(--w) / var(--bg-w) * 100%);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: var(--z, 3);
      transform: translate3d(0,0,0) scale(1);
      transform-origin: 50% 65%;
      transition: transform .22s cubic-bezier(.2,.9,.18,1.25), filter .22s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .sprite-btn .sprite-art {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 18px 22px rgba(0,0,0,.55));
      transition: filter .2s ease, opacity .2s ease;
    }

    /* Дополнительная форма обрезки поверх PNG-альфы, чтобы убрать грубые края авто-вырезки. */
    .sprite-btn.dungeons .sprite-art {
      clip-path: polygon(4% 35%, 23% 13%, 62% 3%, 83% 10%, 98% 37%, 93% 67%, 78% 89%, 35% 99%, 6% 84%, 0 58%);
    }

    .sprite-btn.summon .sprite-art {
      clip-path: polygon(25% 3%, 75% 3%, 92% 16%, 97% 54%, 86% 88%, 65% 99%, 28% 96%, 7% 78%, 5% 22%);
    }

    .sprite-btn.bar .sprite-art {
      clip-path: polygon(7% 6%, 96% 2%, 99% 86%, 82% 96%, 10% 92%, 0 55%);
    }

    .sprite-btn.cyberware .sprite-art {
      clip-path: polygon(11% 4%, 96% 1%, 100% 72%, 82% 99%, 15% 94%, 0 68%, 4% 22%);
    }

    .sprite-btn.main-story .sprite-art {
      clip-path: polygon(12% 6%, 99% 6%, 90% 93%, 1% 93%);
    }

    .sprite-btn::before,
    .sprite-btn::after {
      content: "";
      position: absolute;
      inset: -4%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
      border-radius: 18px;
    }

    .sprite-btn::before {
      background: radial-gradient(ellipse at 50% 55%, rgba(var(--rgb), .42), transparent 58%);
      filter: blur(14px);
      mix-blend-mode: screen;
      z-index: -1;
    }

    .sprite-btn::after {
      inset: 2% 8%;
      background: linear-gradient(115deg, transparent 12%, rgba(255,255,255,0) 34%, rgba(255,255,255,.52) 48%, rgba(var(--rgb), .28) 54%, transparent 70%);
      transform: translateX(-45%) skewX(-10deg);
      mix-blend-mode: screen;
      filter: blur(.5px);
    }

    .sprite-btn:hover,
    .sprite-btn:focus-visible,
    .sprite-btn.is-active {
      transform: translate3d(0, -1.35%, 0) scale(1.035);
      filter:
        drop-shadow(0 0 8px rgba(var(--rgb), .95))
        drop-shadow(0 0 22px rgba(var(--rgb), .58))
        drop-shadow(0 0 48px rgba(var(--rgb), .28));
    }

    .sprite-btn:hover .sprite-art,
    .sprite-btn:focus-visible .sprite-art,
    .sprite-btn.is-active .sprite-art {
      filter:
        brightness(1.14)
        saturate(1.18)
        drop-shadow(0 22px 24px rgba(0,0,0,.58))
        drop-shadow(0 0 3px rgba(255,255,255,.64));
      animation: spriteFloat 1.15s ease-in-out infinite alternate;
    }

    .sprite-btn:hover::before,
    .sprite-btn:focus-visible::before,
    .sprite-btn.is-active::before {
      opacity: 1;
      transform: scale(1.08);
      animation: auraPulse 1.05s ease-in-out infinite alternate;
    }

    .sprite-btn:hover::after,
    .sprite-btn:focus-visible::after,
    .sprite-btn.is-active::after {
      opacity: .9;
      animation: scan .95s ease-out infinite;
    }

    .sprite-label {
      position: absolute;
      left: 50%;
      bottom: -22px;
      transform: translateX(-50%) translateY(6px);
      min-width: max-content;
      padding: 6px 10px;
      border: 1px solid rgba(var(--rgb), .55);
      border-radius: 999px;
      background: rgba(2, 8, 22, .68);
      box-shadow: 0 0 16px rgba(var(--rgb), .22), inset 0 0 12px rgba(var(--rgb), .08);
      color: #f5feff;
      font-size: clamp(10px, 1vw, 13px);
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(10px);
      transition: opacity .18s ease, transform .18s ease;
      text-shadow: 0 0 8px rgba(var(--rgb), .7);
      white-space: nowrap;
    }

    .sprite-btn:hover .sprite-label,
    .sprite-btn:focus-visible .sprite-label,
    .sprite-btn.is-active .sprite-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================================================
       OLD UI BUTTONS: profile, currency, left menu, bottom menu
       ========================================================= */

    .ui-layer {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    .ui-hot {
      --x: 0;
      --y: 0;
      --w: 100;
      --h: 40;
      --rgb: var(--cyan);
      position: absolute;
      left: calc(var(--x) / var(--bg-w) * 100%);
      top: calc(var(--y) / var(--bg-h) * 100%);
      width: calc(var(--w) / var(--bg-w) * 100%);
      height: calc(var(--h) / var(--bg-h) * 100%);
      pointer-events: all;
      border: 1px solid rgba(var(--rgb), .24);
      color: #ecfbff;
      background: linear-gradient(135deg, rgba(3, 10, 27, .63), rgba(17, 3, 32, .52));
      box-shadow: inset 0 0 16px rgba(var(--rgb), .04), 0 8px 18px rgba(0,0,0,.24);
      backdrop-filter: blur(7px);
      cursor: pointer;
      outline: none;
      transform: translateZ(0);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease, background .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .ui-hot::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(var(--rgb), .22), transparent 44%);
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .ui-hot::after {
      content: "";
      position: absolute;
      inset: -40% -70%;
      background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.34) 49%, rgba(var(--rgb), .18) 53%, transparent 62%);
      opacity: 0;
      transform: translateX(-35%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .ui-hot:hover,
    .ui-hot:focus-visible,
    .ui-hot.is-active {
      border-color: rgba(var(--rgb), .95);
      background: linear-gradient(135deg, rgba(5, 22, 42, .76), rgba(31, 4, 47, .68));
      box-shadow:
        0 0 8px rgba(var(--rgb), .52),
        0 0 22px rgba(var(--rgb), .24),
        inset 0 0 20px rgba(var(--rgb), .10);
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .ui-hot:hover::before,
    .ui-hot:focus-visible::before,
    .ui-hot.is-active::before {
      opacity: 1;
    }

    .ui-hot:hover::after,
    .ui-hot:focus-visible::after,
    .ui-hot.is-active::after {
      animation: uiScan .92s ease-out infinite;
    }

    .profile-card {
      border-radius: 10px;
      clip-path: polygon(0 0, 95% 0, 100% 45%, 95% 100%, 0 100%);
      padding: 9px 12px 9px 96px;
      text-align: left;
    }

    .avatar {
      position: absolute;
      left: 9px;
      top: 9px;
      width: 70px;
      height: 70px;
      border: 1px solid rgba(var(--pink), .75);
      border-radius: 4px;
      background:
        radial-gradient(circle at 45% 25%, rgba(255,255,255,.85), transparent 11%),
        radial-gradient(circle at 50% 35%, rgba(190, 133, 255, .95), transparent 28%),
        linear-gradient(135deg, #19072f, #05203c 56%, #0c0614);
      box-shadow: 0 0 18px rgba(var(--pink), .35), inset 0 0 18px rgba(var(--cyan), .14);
    }

    .avatar::before {
      content: "";
      position: absolute;
      left: 20px;
      top: 13px;
      width: 31px;
      height: 42px;
      border-radius: 52% 48% 44% 44%;
      background: linear-gradient(160deg, #d6c2ff, #8c6fff 42%, #1a1230 43%);
      filter: drop-shadow(0 0 8px rgba(var(--pink), .4));
    }

    .avatar::after {
      content: "";
      position: absolute;
      left: 27px;
      top: 38px;
      width: 16px;
      height: 21px;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(#ffd8ec, #a264ac);
      box-shadow: -12px -7px 0 -8px #9ff, 13px -7px 0 -8px #9ff;
    }

    .profile-name {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: clamp(12px, 1.35vw, 19px);
      font-weight: 900;
      line-height: 1.05;
      white-space: nowrap;
    }

    .profile-name small {
      color: #fff;
      font-size: .9em;
      text-shadow: 0 0 8px rgba(var(--pink), .7);
    }

    .xp-line {
      margin-top: 8px;
      height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
    }

    .xp-fill {
      width: 73%;
      height: 100%;
      background: linear-gradient(90deg, #c800ff, #ff2bde);
      box-shadow: 0 0 10px rgba(var(--pink), .8);
    }

    .power {
      margin-top: 7px;
      color: rgb(var(--gold));
      font-weight: 900;
      text-shadow: 0 0 8px rgba(var(--gold), .35);
      font-size: clamp(12px, 1.35vw, 18px);
    }

    .resource {
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px 0 13px;
      font-weight: 900;
      letter-spacing: .02em;
      font-size: clamp(11px, 1.2vw, 16px);
      white-space: nowrap;
    }

    .res-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .res-icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: rgb(var(--rgb));
      text-shadow: 0 0 10px rgba(var(--rgb), .85);
      font-size: 18px;
      flex: 0 0 auto;
    }

    .plus {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 6px;
      background: rgba(255,255,255,.07);
      color: #fff;
      box-shadow: inset 0 0 8px rgba(var(--rgb), .1);
      flex: 0 0 auto;
    }

    .top-icon {
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: clamp(17px, 1.7vw, 25px);
      font-weight: 900;
      background: rgba(3, 8, 20, .38);
      border-color: transparent;
      backdrop-filter: none;
      box-shadow: none;
    }

    .top-icon .badge {
      position: absolute;
      right: 4px;
      top: 2px;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #ff2b76;
      box-shadow: 0 0 9px rgba(255, 43, 118, .8);
      border: 1px solid #fff;
    }

    .event-card {
      border-radius: 9px;
      padding: 12px 14px;
      text-align: left;
      clip-path: polygon(0 0, 96% 0, 100% 18%, 100% 100%, 0 100%);
    }

    .event-kicker {
      color: #ff8cff;
      text-transform: uppercase;
      font-weight: 900;
      font-size: clamp(10px, 1vw, 14px);
      letter-spacing: .08em;
      text-shadow: 0 0 10px rgba(var(--pink), .72);
    }

    .event-title {
      margin-top: 4px;
      font-size: clamp(13px, 1.35vw, 19px);
      font-weight: 900;
      line-height: 1.05;
    }

    .event-time {
      margin-top: 8px;
      color: rgba(236,251,255,.82);
      font-size: clamp(10px, 1vw, 13px);
      font-weight: 700;
    }

    .side-btn {
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: rgba(2, 8, 20, .28);
      border-color: transparent;
      text-align: left;
    }

    .side-icon {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      color: #dffbff;
      font-size: clamp(17px, 1.6vw, 24px);
      text-shadow: 0 0 12px rgba(var(--cyan), .8);
      flex: 0 0 auto;
    }

    .side-label {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .025em;
      font-size: clamp(11px, 1.15vw, 16px);
      color: #effcff;
      text-shadow: 0 0 9px rgba(var(--cyan), .25);
    }

    .new-badge {
      margin-left: auto;
      color: #ff6ef2;
      font-size: clamp(9px, .9vw, 12px);
      font-weight: 900;
      text-shadow: 0 0 10px rgba(var(--pink), .85);
    }

    .bottom-shell {
      --x: 8;
      --y: 680;
      --w: 865;
      --h: 78;
      position: absolute;
      left: calc(var(--x) / var(--bg-w) * 100%);
      top: calc(var(--y) / var(--bg-h) * 100%);
      width: calc(var(--w) / var(--bg-w) * 100%);
      height: calc(var(--h) / var(--bg-h) * 100%);
      z-index: 28;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(7, 18, 37, .88), rgba(5, 12, 27, .72));
      border: 1px solid rgba(var(--cyan), .12);
      clip-path: polygon(0 0, 100% 0, 97% 100%, 0 100%);
      box-shadow: 0 -8px 25px rgba(0,0,0,.32), inset 0 0 25px rgba(var(--cyan), .05);
    }

    .bottom-nav {
      border-radius: 0;
      background: transparent;
      border-color: rgba(var(--cyan), .06);
      border-top-color: transparent;
      border-bottom-color: transparent;
      display: grid;
      place-items: center;
      gap: 3px;
      padding: 6px 4px;
      text-align: center;
    }

    .bottom-nav.home {
      background: linear-gradient(135deg, rgba(0, 133, 199, .66), rgba(9, 50, 86, .82));
      clip-path: polygon(0 0, 80% 0, 100% 100%, 0 100%);
      border-color: rgba(var(--cyan), .35);
    }

    .nav-icon {
      font-size: clamp(18px, 2vw, 28px);
      line-height: 1;
      text-shadow: 0 0 12px rgba(var(--cyan), .65);
    }

    .nav-label {
      font-size: clamp(10px, 1vw, 14px);
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
      color: rgba(236,251,255,.86);
    }

    .hud {
      position: absolute;
      left: 300px;
      bottom: 86px;
      z-index: 40;
      max-width: min(520px, calc(100% - 36px));
      padding: 10px 13px;
      border: 1px solid rgba(var(--cyan), .24);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(2, 8, 22, .56), rgba(25, 4, 35, .46));
      backdrop-filter: blur(10px);
      box-shadow: 0 0 22px rgba(0,0,0,.38), inset 0 0 18px rgba(var(--cyan), .04);
      font-size: clamp(11px, 1vw, 14px);
      line-height: 1.35;
      pointer-events: none;
      opacity: .86;
    }

    .hud strong {
      color: #fff;
      text-shadow: 0 0 10px rgba(var(--pink), .75);
    }

    .hud span { color: rgba(236, 251, 255, .74); }

    .debug {
      position: absolute;
      right: 14px;
      top: 58px;
      z-index: 45;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }

    .debug button {
      pointer-events: all;
      border: 1px solid rgba(var(--cyan), .34);
      color: #edfcff;
      background: rgba(4, 10, 25, .58);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 16px rgba(var(--cyan), .12);
    }

    .debug button:hover { border-color: rgba(var(--pink), .9); }

    .stage.hide-labels .sprite-label { display: none; }

    .stage.editor .sprite-btn,
    .stage.editor .ui-hot {
      outline: 1px dashed rgba(var(--cyan), .5);
      background-color: rgba(var(--cyan), .045);
    }

    .ripple {
      position: absolute;
      width: 24px;
      height: 24px;
      margin: -12px 0 0 -12px;
      border: 2px solid rgba(var(--ripple-rgb), .96);
      border-radius: 999px;
      z-index: 60;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(var(--ripple-rgb), .95));
      animation: ripple .78s ease-out forwards;
    }

    @keyframes spriteFloat {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-5px) rotate(.2deg); }
    }

    @keyframes auraPulse {
      from { opacity: .58; }
      to { opacity: 1; }
    }

    @keyframes scan {
      from { transform: translateX(-72%) skewX(-10deg); opacity: 0; }
      22% { opacity: .85; }
      to { transform: translateX(72%) skewX(-10deg); opacity: 0; }
    }

    @keyframes uiScan {
      from { transform: translateX(-35%); opacity: 0; }
      24% { opacity: .85; }
      to { transform: translateX(38%); opacity: 0; }
    }

    @keyframes ripple {
      from { transform: scale(.55); opacity: 1; }
      to { transform: scale(7); opacity: 0; }
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
        place-items: start center;
      }

      .stage { width: 100vw; }

      .hud {
        left: 10px;
        right: 10px;
        bottom: 86px;
        max-width: none;
        padding: 8px 10px;
      }

      .debug button {
        padding: 6px 8px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="stage" id="stage" aria-label="Главная база">
    <!-- main_menu.html лежит внутри webapp, поэтому пути относительные: ./cyber_base_sprite_assets/... -->
    <img class="bg" src="./cyber_base_sprite_assets/bg_clean_final.png" alt="Очищенный фон базы" draggable="false" />
    <div class="ambient"></div>

    <!-- Main interactive base objects -->
    <button class="sprite-btn dungeons" style="--x: 150; --y: 390; --w: 440; --rgb: 0, 229, 255; --z: 4;" data-name="Dungeons" data-action="Explore. Fight. Ascend." aria-label="Dungeons" type="button">
      <img class="sprite-art" src="./cyber_base_sprite_assets/dungeons.png" alt="Dungeons" draggable="false" />
      <span class="sprite-label">Dungeons</span>
    </button>

    <button class="sprite-btn summon" style="--x: 600; --y: 145; --w: 320; --rgb: 255, 43, 222; --z: 5;" data-name="Summon" data-action="Clone. Summon. Awaken." aria-label="Summon" type="button">
      <img class="sprite-art" src="./cyber_base_sprite_assets/summon.png" alt="Summon" draggable="false" />
      <span class="sprite-label">Summon</span>
    </button>

    <button class="sprite-btn bar" style="--x: 935; --y: 95; --w: 415; --rgb: 255, 43, 222; --z: 4;" data-name="Afterlife Bar" data-action="Drink. Relax. Connect." aria-label="Afterlife Bar" type="button">
      <img class="sprite-art" src="./cyber_base_sprite_assets/bar.png" alt="Afterlife Bar" draggable="false" />
      <span class="sprite-label">Afterlife Bar</span>
    </button>

    <button class="sprite-btn cyberware" style="--x: 835; --y: 430; --w: 475; --rgb: 0, 229, 255; --z: 6;" data-name="Cyberware" data-action="Enhance. Upgrade. Evolve." aria-label="Cyberware" type="button">

  <script>
    const stage = document.getElementById('stage');
    const hud = document.getElementById('hud');
    const hotElements = [...document.querySelectorAll('.sprite-btn, .ui-hot')];

    function rgbOf(el) {
      const raw = (el.getAttribute('style') || '').match(/--rgb:\s*([^;]+)/);
      return raw ? raw[1].trim() : '0, 229, 255';
    }

    function setHud(el) {
      hud.innerHTML = `<strong>${el.dataset.name}</strong><span> — ${el.dataset.action}</span>`;
    }

    function updateMouseVars(el, event) {
      const rect = el.getBoundingClientRect();
      const mx = ((event.clientX - rect.left) / rect.width) * 100;
      const my = ((event.clientY - rect.top) / rect.height) * 100;
      el.style.setProperty('--mx', `${mx}%`);
      el.style.setProperty('--my', `${my}%`);
    }

    function tapFX(el, x, y) {
      hotElements.forEach(item => item.classList.remove('is-active'));
      el.classList.add('is-active');
      setHud(el);

      if (Number.isFinite(x) && Number.isFinite(y)) {
        const rect = stage.getBoundingClientRect();
        const ripple = document.createElement('i');
        ripple.className = 'ripple';
        ripple.style.left = `${x - rect.left}px`;
        ripple.style.top = `${y - rect.top}px`;
        ripple.style.setProperty('--ripple-rgb', rgbOf(el));
        stage.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      }

      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.classList.remove('is-active');
      }, 1100);
    }

    hotElements.forEach(el => {
      el.addEventListener('pointerenter', event => {
        updateMouseVars(el, event);
        setHud(el);
      });

      el.addEventListener('pointermove', event => {
        updateMouseVars(el, event);
      });

      el.addEventListener('pointerdown', event => {
        updateMouseVars(el, event);
        tapFX(el, event.clientX, event.clientY);
      });

      el.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          tapFX(el, NaN, NaN);
        }
      });
    });

    document.getElementById('toggleLabels').addEventListener('click', () => {
      stage.classList.toggle('hide-labels');
    });

    document.getElementById('toggleEditor').addEventListener('click', () => {
      stage.classList.toggle('editor');
    });
  </script>
