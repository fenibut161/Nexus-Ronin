<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS RONIN — Main Menu</title>
  <style>
    :root {
      --safe-top: max(60px, var(--tg-content-safe-area-inset-top, 60px));
      --safe-bottom: max(20px, var(--tg-content-safe-area-inset-bottom, 20px));
      --safe-left: max(16px, var(--tg-content-safe-area-inset-left, 16px));
      --safe-right: max(16px, var(--tg-content-safe-area-inset-right, 16px));

      --cyan: #00f0ff;
      --pink: #ff007b;
      --gold: #ffd36a;
      --dark-bg: #060913;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--dark-bg);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-image: 
        linear-gradient(to bottom, rgba(6, 9, 19, 0.4) 0%, rgba(6, 9, 19, 0.1) 40%, rgba(6, 9, 19, 0.8) 85%, rgba(6, 9, 19, 0.98) 100%),
        url('webapp/assets/images/backgrounds/main_menu_bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Верхняя панель ресурсов (с защитным отступом 60px от кнопок Telegram) */
    .top-resources {
      width: 100%;
      padding-top: max(60px, var(--tg-content-safe-area-inset-top, 60px));
      padding-left: max(16px, var(--tg-content-safe-area-inset-left, 16px));
      padding-right: max(16px, var(--tg-content-safe-area-inset-right, 16px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }

    .resource-pill {
      background: rgba(10, 18, 35, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 20px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
      backdrop-filter: blur(8px);
    }

    .plus-btn {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
      cursor: pointer;
    }

    .header-logo-container {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    .nr-badge {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(180, 0, 255, 0.35));
      border: 1px solid var(--cyan);
      padding: 5px 16px;
      font-size: 22px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 2px;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      margin-bottom: 8px;
    }

    .game-subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 3px;
    }

    .game-title {
      font-size: 34px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 1px;
    }
    .game-title .nexus { color: #ffffff; }
    .game-title .ronin { color: var(--gold); }

    .menu-hud-box {
      width: calc(100% - 32px);
      max-width: 420px;
      margin-bottom: max(35px, calc(var(--tg-content-safe-area-inset-bottom, 20px) + 35px));
      z-index: 20;
    }

    .cyber-box {
      background: rgba(6, 12, 24, 0.94);
      border: 1px solid rgba(0, 240, 255, 0.45);
      padding: 20px;
      position: relative;
      clip-path: polygon(15px 0%, 100% 0%, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0% 100%, 0% 15px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 240, 255, 0.12);
      backdrop-filter: blur(14px);
    }

    .menu-badge-header {
      background: linear-gradient(90deg, rgba(0,240,255,0.2), rgba(255,0,123,0.2));
      border-left: 3px solid var(--cyan);
      border-right: 3px solid var(--pink);
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 14px;
    }

    .cyber-btn {
      width: 100%;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    }
    .cyber-btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(90deg, #ffe082 0%, #ffd36a 50%, #ffaf00 100%);
      color: #060913;
      margin-bottom: 10px;
      box-shadow: 0 0 18px rgba(255, 211, 106, 0.45);
    }

    .btn-secondary {
      background: rgba(10, 25, 45, 0.75);
      color: #fff;
      border: 1px solid rgba(0, 240, 255, 0.4);
    }
    .btn-secondary:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: var(--cyan);
    }

    .build-version {
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 12px;
    }

    .bottom-nav {
      position: absolute;
      bottom: max(15px, var(--tg-content-safe-area-inset-bottom, 15px));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 30px;
      z-index: 30;
      opacity: 0.35;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<audio id="bgMusic" loop preload="auto">
  <source src="webapp/assets/audio/music/neon_soul.mp3" type="audio/mpeg">
</audio>

<div class="top-resources">
  <div class="resource-pill">
    <span style="color:#22e7ff;">⚡</span> 120 / 120
    <div class="plus-btn">+</div>
  </div>
  <div class="resource-pill">
    <span style="color:#ffd36a;">🪙</span> 2,450,790
    <div class="plus-btn">+</div>
  </div>
  <div class="resource-pill">
    <span style="color:#ff007b;">💎</span> 8,500
    <div class="plus-btn">+</div>
  </div>
</div>

<div class="header-logo-container">
  <div class="nr-badge">NR</div>
  <div class="game-subtitle">LEGENDARY CYBERPUNK RPG</div>
  <div class="game-title">
    <div class="nexus">NEXUS</div>
    <div class="ronin">RONIN</div>
  </div>
</div>

<div style="flex:1;"></div>

<div class="menu-hud-box">
  <div class="cyber-box">
    <div class="menu-badge-header">🌟 ГЛАВНАЯ БАЗА РОНИНА 🌟</div>
    <button class="cyber-btn btn-primary" onclick="alert('Переход к капсуле Призыва (Summon)...')">🧬 ПРИЗЫВ (SUMMON)</button>
    <button class="cyber-btn btn-secondary" style="margin-bottom: 10px;" onclick="alert('Список кибер-миссий...')">⚔️ КИБЕР-МИССИИ</button>
    <button class="cyber-btn btn-secondary" style="margin-bottom: 10px;" id="musicToggleBtn">🔊 МУЗЫКА: ВКЛ</button>
    <button class="cyber-btn btn-secondary" id="backToLoadingBtn" style="border-color: #555; color: #aaa;">🚪 НА ЗАГРУЗОЧНЫЙ ЭКРАН</button>
  </div>
  <div class="build-version">CONNECTED TO NEXUS CORE</div>
</div>

<div class="bottom-nav">
  <div>TECH</div>
  <div>CODEX</div>
  <div>CORP</div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram?.WebApp;
  const bgMusic = document.getElementById('bgMusic');
  const musicToggleBtn = document.getElementById('musicToggleBtn');
  const backToLoadingBtn = document.getElementById('backToLoadingBtn');
  let isMusicPlaying = false;

  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#060913');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#060913');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }

  // Умный поиск картинки главного меню (.jpg / .png / пути)
  const bgVariants = [
    'webapp/assets/images/backgrounds/main_menu_bg.jpg',
    './assets/images/backgrounds/main_menu_bg.jpg',
    'assets/images/backgrounds/main_menu_bg.jpg',
    '/webapp/assets/images/backgrounds/main_menu_bg.jpg',
    'webapp/assets/images/backgrounds/main_menu_bg.png',
    './assets/images/backgrounds/main_menu_bg.png'
  ];

  function tryLoadMenuBg(vIndex) {
    if (vIndex >= bgVariants.length) return;
    const img = new Image();
    img.onload = () => {
      document.body.style.backgroundImage = `linear-gradient(to bottom, rgba(6, 9, 19, 0.4) 0%, rgba(6, 9, 19, 0.1) 40%, rgba(6, 9, 19, 0.8) 85%, rgba(6, 9, 19, 0.98) 100%), url('${bgVariants[vIndex]}')`;
    };
    img.onerror = () => tryLoadMenuBg(vIndex + 1);
    img.src = bgVariants[vIndex];
  }
  tryLoadMenuBg(0);

  bgMusic.volume = 0.65;
  bgMusic.play().then(() => {
    isMusicPlaying = true;
    musicToggleBtn.textContent = "🔊 МУЗЫКА: ВКЛ";
  }).catch(e => {
    musicToggleBtn.textContent = "🔇 МУЗЫКА: ВЫКЛ (НАЖМИТЕ)";
  });

  musicToggleBtn.addEventListener('click', () => {
    if (isMusicPlaying) {
      bgMusic.pause();
      isMusicPlaying = false;
      musicToggleBtn.textContent = "🔇 МУЗЫКА: ВЫКЛ";
    } else {
      bgMusic.play();
      isMusicPlaying = true;
      musicToggleBtn.textContent = "🔊 МУЗЫКА: ВКЛ";
    }
  });

  backToLoadingBtn.addEventListener('click', () => {
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
