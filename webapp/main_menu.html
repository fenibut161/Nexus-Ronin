<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Интерактивная база — фон + sprite objects</title>
  <style>
    :root {
      --cyan: 0, 229, 255;
      --pink: 255, 43, 222;
      --gold: 255, 213, 95;
      --bg-w: 1376;
      --bg-h: 768;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 52% 45%, rgba(104, 0, 255, .24), transparent 34%),
        radial-gradient(circle at 18% 82%, rgba(var(--cyan), .16), transparent 30%),
        linear-gradient(135deg, #020611, #070014 52%, #010208);
      color: #ecfbff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .stage {
      position: relative;
      width: min(100vw, 1376px);
      aspect-ratio: 1376 / 768;
      overflow: hidden;
      background: #050712;
      box-shadow: 0 28px 90px rgba(0,0,0,.74), 0 0 70px rgba(var(--pink), .18);
      isolation: isolate;
      user-select: none;
      touch-action: manipulation;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      filter: saturate(1.04) contrast(1.02);
    }

    .ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 47% 51%, rgba(var(--pink), .12), transparent 24%),
        radial-gradient(ellipse at 34% 72%, rgba(var(--cyan), .14), transparent 24%),
        linear-gradient(to bottom, transparent 66%, rgba(0,0,0,.26));
      mix-blend-mode: screen;
      opacity: .9;
      z-index: 1;
    }

    .sprite-btn {
      --x: 0px;
      --y: 0px;
      --w: 200px;
      --rgb: var(--cyan);
      position: absolute;
      left: calc(var(--x) / var(--bg-w) * 100%);
      top: calc(var(--y) / var(--bg-h) * 100%);
      width: calc(var(--w) / var(--bg-w) * 100%);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: var(--z, 3);
      transform: translate3d(0,0,0) scale(1);
      transform-origin: 50% 65%;
      transition: transform .22s cubic-bezier(.2,.9,.18,1.25), filter .22s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .sprite-btn img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 18px 22px rgba(0,0,0,.55));
      transition: filter .2s ease, opacity .2s ease;
    }

    .sprite-btn::before,
    .sprite-btn::after {
      content: "";
      position: absolute;
      inset: -4%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
      border-radius: 18px;
    }

    /* soft outer aura */
    .sprite-btn::before {
      background: radial-gradient(ellipse at 50% 55%, rgba(var(--rgb), .42), transparent 58%);
      filter: blur(14px);
      mix-blend-mode: screen;
      z-index: -1;
    }

    /* animated scanline sheen */
    .sprite-btn::after {
      inset: 2% 8%;
      background: linear-gradient(115deg, transparent 12%, rgba(255,255,255,.0) 34%, rgba(255,255,255,.52) 48%, rgba(var(--rgb), .28) 54%, transparent 70%);
      transform: translateX(-45%) skewX(-10deg);
      mix-blend-mode: screen;
      filter: blur(.5px);
    }

    .sprite-btn:hover,
    .sprite-btn:focus-visible,
    .sprite-btn.is-active {
      transform: translate3d(0, -1.35%, 0) scale(1.035);
      filter:
        drop-shadow(0 0 8px rgba(var(--rgb), .95))
        drop-shadow(0 0 22px rgba(var(--rgb), .58))
        drop-shadow(0 0 48px rgba(var(--rgb), .28));
    }

    .sprite-btn:hover img,
    .sprite-btn:focus-visible img,
    .sprite-btn.is-active img {
      filter:
        brightness(1.14)
        saturate(1.18)
        drop-shadow(0 22px 24px rgba(0,0,0,.58))
        drop-shadow(0 0 3px rgba(255,255,255,.64));
      animation: spriteFloat 1.15s ease-in-out infinite alternate;
    }

    .sprite-btn:hover::before,
    .sprite-btn:focus-visible::before,
    .sprite-btn.is-active::before {
      opacity: 1;
      transform: scale(1.08);
      animation: auraPulse 1.05s ease-in-out infinite alternate;
    }

    .sprite-btn:hover::after,
    .sprite-btn:focus-visible::after,
    .sprite-btn.is-active::after {
      opacity: .9;
      animation: scan .95s ease-out infinite;
    }

    .sprite-btn .label {
      position: absolute;
      left: 50%;
      bottom: -22px;
      transform: translateX(-50%) translateY(6px);
      min-width: max-content;
      padding: 6px 10px;
      border: 1px solid rgba(var(--rgb), .55);
      border-radius: 999px;
      background: rgba(2, 8, 22, .68);
      box-shadow: 0 0 16px rgba(var(--rgb), .22), inset 0 0 12px rgba(var(--rgb), .08);
      color: #f5feff;
      font-size: clamp(10px, 1vw, 13px);
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(10px);
      transition: opacity .18s ease, transform .18s ease;
      text-shadow: 0 0 8px rgba(var(--rgb), .7);
    }

    .sprite-btn:hover .label,
    .sprite-btn:focus-visible .label,
    .sprite-btn.is-active .label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hud {
      position: absolute;
      left: 18px;
      bottom: 16px;
      z-index: 10;
      max-width: min(520px, calc(100% - 36px));
      padding: 12px 14px;
      border: 1px solid rgba(var(--cyan), .32);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(2, 8, 22, .76), rgba(25, 4, 35, .66));
      backdrop-filter: blur(13px);
      box-shadow: 0 0 28px rgba(0,0,0,.48), inset 0 0 22px rgba(var(--cyan), .05);
      font-size: clamp(12px, 1.1vw, 15px);
      line-height: 1.35;
      pointer-events: none;
    }

    .hud strong {
      color: #fff;
      text-shadow: 0 0 10px rgba(var(--pink), .75);
    }

    .hud span { color: rgba(236, 251, 255, .74); }

    .debug {
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }

    .debug button {
      border: 1px solid rgba(var(--cyan), .5);
      color: #edfcff;
      background: rgba(4, 10, 25, .72);
      border-radius: 12px;
      padding: 9px 11px;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 16px rgba(var(--cyan), .12);
    }

    .debug button:hover { border-color: rgba(var(--pink), .9); }

    .stage.hide-labels .sprite-btn .label { display: none; }

    .stage.editor .sprite-btn {
      outline: 1px dashed rgba(var(--cyan), .5);
      background: rgba(var(--cyan), .035);
    }

    .ripple {
      position: absolute;
      width: 24px;
      height: 24px;
      margin: -12px 0 0 -12px;
      border: 2px solid rgba(var(--ripple-rgb), .96);
      border-radius: 999px;
      z-index: 9;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(var(--ripple-rgb), .95));
      animation: ripple .78s ease-out forwards;
    }

    @keyframes spriteFloat {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-5px) rotate(.2deg); }
    }

    @keyframes auraPulse {
      from { opacity: .58; }
      to { opacity: 1; }
    }

    @keyframes scan {
      from { transform: translateX(-72%) skewX(-10deg); opacity: 0; }
      22% { opacity: .85; }
      to { transform: translateX(72%) skewX(-10deg); opacity: 0; }
    }

    @keyframes ripple {
      from { transform: scale(.55); opacity: 1; }
      to { transform: scale(7); opacity: 0; }
    }

    @media (max-width: 760px) {
      body { overflow: auto; place-items: start center; }
      .stage { width: 100vw; }
      .debug button { padding: 7px 9px; font-size: 10px; }
      .hud { padding: 9px 11px; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="База с объектами-спрайтами">
    <img class="bg" src="cyber_base_sprite_assets/bg_clean_final.png" alt="Очищенный фон базы" draggable="false" />
    <div class="ambient"></div>

    <!-- Координаты указаны в системе чистого фона 1376×768. Меняйте --x/--y/--w для точного арт-дирекшена. -->
    <button class="sprite-btn" style="--x: 150; --y: 390; --w: 440; --rgb: 0, 229, 255; --z: 4;" data-name="Dungeons" data-action="Explore. Fight. Ascend." aria-label="Dungeons">
      <img src="cyber_base_sprite_assets/dungeons.png" alt="Dungeons" draggable="false" />
      <span class="label">Dungeons</span>
    </button>

    <button class="sprite-btn" style="--x: 600; --y: 145; --w: 320; --rgb: 255, 43, 222; --z: 5;" data-name="Summon" data-action="Clone. Summon. Awaken." aria-label="Summon">
      <img src="cyber_base_sprite_assets/summon.png" alt="Summon" draggable="false" />
      <span class="label">Summon</span>
    </button>

    <button class="sprite-btn" style="--x: 935; --y: 95; --w: 415; --rgb: 255, 43, 222; --z: 4;" data-name="Afterlife Bar" data-action="Drink. Relax. Connect." aria-label="Afterlife Bar">
      <img src="cyber_base_sprite_assets/bar.png" alt="Afterlife Bar" draggable="false" />
      <span class="label">Afterlife Bar</span>
    </button>

    <button class="sprite-btn" style="--x: 835; --y: 430; --w: 475; --rgb: 0, 229, 255; --z: 6;" data-name="Cyberware" data-action="Enhance. Upgrade. Evolve." aria-label="Cyberware">
      <img src="cyber_base_sprite_assets/cyberware.png" alt="Cyberware" draggable="false" />
      <span class="label">Cyberware</span>
    </button>

    <button class="sprite-btn" style="--x: 935; --y: 635; --w: 390; --rgb: 255, 43, 222; --z: 7;" data-name="Main Story" data-action="Chapter 12-5" aria-label="Main Story">
      <img src="cyber_base_sprite_assets/main_story.png" alt="Main Story" draggable="false" />
      <span class="label">Main Story</span>
    </button>

    <div class="debug">
      <button id="toggleLabels" type="button">Labels</button>
      <button id="toggleEditor" type="button">Editor</button>
    </div>

    <div class="hud" id="hud">
      <strong>Фон очищен, объекты вынесены в PNG-спрайты.</strong>
      <span> Наведи курсор или тапни: спрайт подсветится, приподнимется, появится aura/scan animation.</span>
    </div>
  </main>

  <script>
    const stage = document.getElementById('stage');
    const hud = document.getElementById('hud');
    const buttons = [...document.querySelectorAll('.sprite-btn')];

    function rgbOf(el) {
      const raw = (el.getAttribute('style') || '').match(/--rgb:\s*([^;]+)/);
      return raw ? raw[1].trim() : '0, 229, 255';
    }

    function setHud(el) {
      hud.innerHTML = `<strong>${el.dataset.name}</strong><span> — ${el.dataset.action}. Это отдельный PNG-спрайт поверх очищенного фона.</span>`;
    }

    function tapFX(el, x, y) {
      buttons.forEach(b => b.classList.remove('is-active'));
      el.classList.add('is-active');
      setHud(el);

      if (Number.isFinite(x) && Number.isFinite(y)) {
        const rect = stage.getBoundingClientRect();
        const r = document.createElement('i');
        r.className = 'ripple';
        r.style.left = `${x - rect.left}px`;
        r.style.top = `${y - rect.top}px`;
        r.style.setProperty('--ripple-rgb', rgbOf(el));
        stage.appendChild(r);
        r.addEventListener('animationend', () => r.remove());
      }

      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove('is-active'), 1100);
    }

    buttons.forEach(el => {
      el.addEventListener('pointerenter', () => setHud(el));
      el.addEventListener('pointerdown', event => tapFX(el, event.clientX, event.clientY));
      el.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          tapFX(el, NaN, NaN);
        }
      });
    });

    document.getElementById('toggleLabels').addEventListener('click', () => {
      stage.classList.toggle('hide-labels');
    });

    document.getElementById('toggleEditor').addEventListener('click', () => {
      stage.classList.toggle('editor');
    });
  </script>
</body>
</html>
