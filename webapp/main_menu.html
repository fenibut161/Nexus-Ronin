<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная База</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #game-screen {
            position: relative;
            /* Размеры скриншота 1280x853, сохраняем пропорции */
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 1280 / 853;
            /* ВНИМАНИЕ: Замените путь ниже на вашу картинку, когда загрузите на GitHub */
            background-image: url('IMG_4870.jpeg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        /* SVG слой для интерактивных зон */
        #interaction-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Базовые стили для кликабельных зон */
        .zone {
            fill: rgba(0, 255, 255, 0.0);
            stroke: rgba(0, 255, 255, 0.0);
            stroke-width: 3;
            cursor: pointer;
            transition: all 0.3s ease;
            /* Отключаем выделение при тапах на мобильных */
            -webkit-tap-highlight-color: transparent; 
        }

        /* Эффект при наведении (hover) / тапе */
        .zone:hover, .zone:active {
            fill: rgba(0, 255, 255, 0.2);
            stroke: rgba(0, 255, 255, 0.8);
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8));
        }

        /* Всплывающая подсказка (Tooltip) */
        #tooltip {
            position: absolute;
            background: rgba(10, 10, 20, 0.9);
            color: #0ff;
            border: 1px solid #0ff;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 20;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            white-space: nowrap;
        }

        /* Стили для UI уведомлений */
        #notification {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 100, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 30;
            pointer-events: none;
            text-align: center;
            font-size: clamp(14px, 3vw, 18px); /* Адаптивный шрифт */
        }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="notification">Открытие...</div>
        
        <!-- SVG Canvas: viewBox совпадает с реальным разрешением картинки (1280x853) -->
        <svg id="interaction-layer" viewBox="0 0 1280 853" preserveAspectRatio="none">
            
            <!-- 1. Dungeons (Голографический стол) -->
            <polygon class="zone" data-name="Вход в Dungeons (Подземелья)" 
                     points="190,470 510,480 620,680 470,780 180,810 50,680" />
                     
            <!-- 2. Summon (Капсула с девушкой по центру) -->
            <polygon class="zone" data-name="Summon (Призыв агентов)" 
                     points="550,220 730,220 770,550 770,680 520,680 520,550" />

            <!-- 3. Afterlife Bar (Бар справа сверху) -->
            <polygon class="zone" data-name="Afterlife Bar (Зона отдыха)" 
                     points="850,150 1260,150 1260,440 850,440" />

            <!-- 4. Cyberware (Верстак с механической рукой) -->
            <polygon class="zone" data-name="Cyberware (Улучшения)" 
                     points="850,480 1150,480 1260,780 850,780" />

            <!-- 5. Main Story (Кнопка в правом нижнем углу) -->
            <polygon class="zone" data-name="Main Story (Сюжетная кампания)" 
                     points="940,760 1280,760 1280,853 900,853" />

            <!-- 6. Профиль Игрока (Левый верхний угол) -->
            <rect class="zone" data-name="Профиль Игрока (Nightshade)" 
                  x="10" y="10" width="280" height="110" />

            <!-- 7. Ивент (Neon Uprising) -->
            <rect class="zone" data-name="Событие: Neon Uprising" 
                  x="10" y="140" width="230" height="100" />

            <!-- 8. Боковое меню (Missions, Store и т.д.) -->
            <rect class="zone" data-name="Боковое меню навигации" 
                  x="10" y="270" width="180" height="380" />

            <!-- 9. Нижняя панель (Home, Agents, Squad...) -->
            <rect class="zone" data-name="Управление отрядом и технологиями" 
                  x="10" y="780" width="800" height="70" />

            <!-- 10. Ресурсы (Верхняя панель) -->
            <rect class="zone" data-name="Ресурсы и Валюта" 
                  x="400" y="10" width="500" height="60" />

        </svg>

        <div id="tooltip"></div>
    </div>

    <script>
        const zones = document.querySelectorAll('.zone');
        const tooltip = document.getElementById('tooltip');
        const gameScreen = document.getElementById('game-screen');
        const notification = document.getElementById('notification');
        let notifyTimeout;

        // Определяем, мобильное ли устройство (поддержка touch)
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        zones.forEach(zone => {
            
            // На ПК показываем тултип при наведении
            if (!isTouchDevice) {
                zone.addEventListener('mousemove', (e) => {
                    const rect = gameScreen.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    tooltip.style.left = (x + 15) + 'px';
                    tooltip.style.top = (y + 15) + 'px';
                    tooltip.style.opacity = '1';
                    tooltip.textContent = zone.getAttribute('data-name');
                });

                zone.addEventListener('mouseleave', () => {
                    tooltip.style.opacity = '0';
                });
            }

            // Обработка клика / тапа
            zone.addEventListener('click', (e) => {
                const name = zone.getAttribute('data-name');
                
                // Показываем UI уведомление
                notification.textContent = `Загрузка модуля: ${name}...`;
                notification.style.opacity = '1';
                
                clearTimeout(notifyTimeout);
                notifyTimeout = setTimeout(() => {
                    notification.style.opacity = '0';
                }, 2000);
            });
        });
    </script>
</body>
</html>
