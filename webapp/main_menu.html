<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cyber Base — Main Menu</title>

  <style>
    :root {
      --cyan: 0, 229, 255;
      --pink: 255, 43, 222;
      --gold: 255, 213, 95;
      --violet: 156, 81, 255;
      --bg-w: 1376;
      --bg-h: 768;
      /* Отступы для мобильного webview, где сверху может быть системная шапка с Close / ⋮ */
      --mobile-top-gap: 54px;
      --mobile-bottom-gap: 0px;
      --mobile-side-gap: 0px;
      --sprite-y-shift: 0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #020611;
      color: #ecfbff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 52% 45%, rgba(104, 0, 255, .24), transparent 34%),
        radial-gradient(circle at 18% 82%, rgba(var(--cyan), .16), transparent 30%),
        linear-gradient(135deg, #020611, #070014 52%, #010208);
    }

    button {
      font: inherit;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #050712;
      box-shadow: none;
      isolation: isolate;
      user-select: none;
      touch-action: manipulation;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      filter: saturate(1.04) contrast(1.02);
      z-index: 0;
    }

    .ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 47% 51%, rgba(var(--pink), .12), transparent 24%),
        radial-gradient(ellipse at 34% 72%, rgba(var(--cyan), .14), transparent 24%),
        linear-gradient(to bottom, transparent 66%, rgba(0,0,0,.26));
      mix-blend-mode: screen;
      opacity: .9;
      z-index: 1;
    }

    /* =========================================================
       MAIN OBJECT SPRITES
       Фон лежит отдельно, эти объекты — отдельные PNG-спрайты.
       Координаты в системе 1376×768.
       ========================================================= */

    .sprite-btn {
      --x: 0px;
      --y: 0px;
      --w: 200px;
      --rgb: var(--cyan);
      position: absolute;
      left: calc(var(--x) / var(--bg-w) * 100%);
      top: calc(var(--y) / var(--bg-h) * 100%);
      width: calc(var(--w) / var(--bg-w) * 100%);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: var(--z, 3);
      transform: translate3d(0,0,0) scale(1);
      transform-origin: 50% 65%;
      transition: transform .22s cubic-bezier(.2,.9,.18,1.25), filter .22s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .sprite-btn .sprite-art {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 18px 22px rgba(0,0,0,.55));
      transition: filter .2s ease, opacity .2s ease;
    }

    /* Дополнительная форма обрезки поверх PNG-альфы, чтобы убрать грубые края авто-вырезки. */
    .sprite-btn.dungeons .sprite-art {
      clip-path: polygon(4% 35%, 23% 13%, 62% 3%, 83% 10%, 98% 37%, 93% 67%, 78% 89%, 35% 99%, 6% 84%, 0 58%);
    }

    .sprite-btn.summon .sprite-art {
      clip-path: polygon(25% 3%, 75% 3%, 92% 16%, 97% 54%, 86% 88%, 65% 99%, 28% 96%, 7% 78%, 5% 22%);
    }

    .sprite-btn.bar .sprite-art {
      clip-path: polygon(7% 6%, 96% 2%, 99% 86%, 82% 96%, 10% 92%, 0 55%);
    }

    .sprite-btn.cyberware .sprite-art {
      clip-path: polygon(11% 4%, 96% 1%, 100% 72%, 82% 99%, 15% 94%, 0 68%, 4% 22%);
    }

    .sprite-btn.main-story .sprite-art {
      clip-path: polygon(12% 6%, 99% 6%, 90% 93%, 1% 93%);
    }

    .sprite-btn.main-story {
      transform-origin: 100% 100%;
    }

    .sprite-btn.main-story .sprite-art {
      filter: brightness(1.12) saturate(1.18) drop-shadow(0 0 18px rgba(var(--pink), .35)) drop-shadow(0 18px 24px rgba(0,0,0,.58));
    }


    .sprite-btn::before,
    .sprite-btn::after {
      content: "";
      position: absolute;
      inset: -4%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
      border-radius: 18px;
    }

    .sprite-btn::before {
      background: radial-gradient(ellipse at 50% 55%, rgba(var(--rgb), .42), transparent 58%);
      filter: blur(14px);
      mix-blend-mode: screen;
      z-index: -1;
    }

    .sprite-btn::after {
      inset: 2% 8%;
      background: linear-gradient(115deg, transparent 12%, rgba(255,255,255,0) 34%, rgba(255,255,255,.52) 48%, rgba(var(--rgb), .28) 54%, transparent 70%);
      transform: translateX(-45%) skewX(-10deg);
      mix-blend-mode: screen;
      filter: blur(.5px);
    }

    .sprite-btn:hover,
    .sprite-btn:focus-visible,
    .sprite-btn.is-active {
      transform: translate3d(0, -1.35%, 0) scale(1.035);
      filter:
        drop-shadow(0 0 8px rgba(var(--rgb), .95))
        drop-shadow(0 0 22px rgba(var(--rgb), .58))
        drop-shadow(0 0 48px rgba(var(--rgb), .28));
    }

    .sprite-btn:hover .sprite-art,
    .sprite-btn:focus-visible .sprite-art,
    .sprite-btn.is-active .sprite-art {
      filter:
        brightness(1.14)
        saturate(1.18)
        drop-shadow(0 22px 24px rgba(0,0,0,.58))
        drop-shadow(0 0 3px rgba(255,255,255,.64));
      animation: spriteFloat 1.15s ease-in-out infinite alternate;
    }

    .sprite-btn:hover::before,
    .sprite-btn:focus-visible::before,
    .sprite-btn.is-active::before {
      opacity: 1;
      transform: scale(1.08);
      animation: auraPulse 1.05s ease-in-out infinite alternate;
    }

    .sprite-btn:hover::after,
    .sprite-btn:focus-visible::after,
    .sprite-btn.is-active::after {
      opacity: .9;
      animation: scan .95s ease-out infinite;
    }

    .sprite-label {
      position: absolute;
      left: 50%;
      bottom: -22px;
      transform: translateX(-50%) translateY(6px);
      min-width: max-content;
      padding: 6px 10px;
      border: 1px solid rgba(var(--rgb), .55);
      border-radius: 999px;
      background: rgba(2, 8, 22, .68);
      box-shadow: 0 0 16px rgba(var(--rgb), .22), inset 0 0 12px rgba(var(--rgb), .08);
      color: #f5feff;
      font-size: clamp(9px, .86vw, 12px);
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(10px);
      transition: opacity .18s ease, transform .18s ease;
      text-shadow: 0 0 8px rgba(var(--rgb), .7);
      white-space: nowrap;
    }

    .sprite-btn:hover .sprite-label,
    .sprite-btn:focus-visible .sprite-label,
    .sprite-btn.is-active .sprite-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================================================
       OLD UI BUTTONS: profile, currency, left menu, bottom menu
       ========================================================= */

    .ui-layer {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    .ui-hot {
      --x: 0;
      --y: 0;
      --w: 100;
      --h: 40;
      --rgb: var(--cyan);
      position: absolute;
      left: calc(var(--x) / var(--bg-w) * 100%);
      top: calc(var(--y) / var(--bg-h) * 100%);
      width: calc(var(--w) / var(--bg-w) * 100%);
      height: calc(var(--h) / var(--bg-h) * 100%);
      pointer-events: all;
      border: 1px solid rgba(var(--rgb), .24);
      color: #ecfbff;
      background: linear-gradient(135deg, rgba(3, 10, 27, .63), rgba(17, 3, 32, .52));
      box-shadow: inset 0 0 16px rgba(var(--rgb), .04), 0 8px 18px rgba(0,0,0,.24);
      backdrop-filter: blur(7px);
      cursor: pointer;
      outline: none;
      transform: translateZ(0);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease, background .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .ui-hot::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(var(--rgb), .22), transparent 44%);
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .ui-hot::after {
      content: "";
      position: absolute;
      inset: -40% -70%;
      background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.34) 49%, rgba(var(--rgb), .18) 53%, transparent 62%);
      opacity: 0;
      transform: translateX(-35%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .ui-hot:hover,
    .ui-hot:focus-visible,
    .ui-hot.is-active {
      border-color: rgba(var(--rgb), .95);
      background: linear-gradient(135deg, rgba(5, 22, 42, .76), rgba(31, 4, 47, .68));
      box-shadow:
        0 0 8px rgba(var(--rgb), .52),
        0 0 22px rgba(var(--rgb), .24),
        inset 0 0 20px rgba(var(--rgb), .10);
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .ui-hot:hover::before,
    .ui-hot:focus-visible::before,
    .ui-hot.is-active::before {
      opacity: 1;
    }

    .ui-hot:hover::after,
    .ui-hot:focus-visible::after,
    .ui-hot.is-active::after {
      animation: uiScan .92s ease-out infinite;
    }

    .profile-card {
      border-radius: 10px;
      clip-path: polygon(0 0, 95% 0, 100% 45%, 95% 100%, 0 100%);
      padding: 9px 12px 9px 96px;
      text-align: left;
    }


    /* v9: профиль больше не рисует большое прозрачное поле вокруг аватара. */
    .profile-card {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      clip-path: none !important;
      padding: 10px 12px 6px 92px;
      overflow: visible;
    }

    .profile-card:hover,
    .profile-card:focus-visible,
    .profile-card.is-active {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      filter: none !important;
      transform: none !important;
    }

    .profile-card::before,
    .profile-card::after {
      display: none !important;
    }

    .avatar {
      position: absolute;
      left: 5px;
      top: 0px;
      width: 62px;
      height: 62px;
      border: 1px solid rgba(var(--pink), .75);
      border-radius: 4px;
      background:
        radial-gradient(circle at 45% 25%, rgba(255,255,255,.85), transparent 11%),
        radial-gradient(circle at 50% 35%, rgba(190, 133, 255, .95), transparent 28%),
        linear-gradient(135deg, #19072f, #05203c 56%, #0c0614);
      box-shadow: 0 0 18px rgba(var(--pink), .35), inset 0 0 18px rgba(var(--cyan), .14);
    }


    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }

    .avatar.has-image::before,
    .avatar.has-image::after {
      display: none;
    }

    .avatar::before {
      content: "";
      position: absolute;
      left: 20px;
      top: 13px;
      width: 31px;
      height: 42px;
      border-radius: 52% 48% 44% 44%;
      background: linear-gradient(160deg, #d6c2ff, #8c6fff 42%, #1a1230 43%);
      filter: drop-shadow(0 0 8px rgba(var(--pink), .4));
    }

    .avatar::after {
      content: "";
      position: absolute;
      left: 27px;
      top: 38px;
      width: 16px;
      height: 21px;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(#ffd8ec, #a264ac);
      box-shadow: -12px -7px 0 -8px #9ff, 13px -7px 0 -8px #9ff;
    }

    .profile-name {
      display: flex;
      justify-content: flex-start;
      gap: 18px;
      font-size: clamp(12px, 1.35vw, 19px);
      font-weight: 900;
      line-height: 1.05;
      white-space: nowrap;
    }

    .profile-name small {
      color: #fff;
      font-size: .9em;
      text-shadow: 0 0 8px rgba(var(--pink), .7);
    }

    .xp-line {
      margin-top: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
    }

    .xp-fill {
      width: 73%;
      height: 100%;
      background: linear-gradient(90deg, #c800ff, #ff2bde);
      box-shadow: 0 0 10px rgba(var(--pink), .8);
    }

    .power {
      margin-top: 5px;
      color: rgb(var(--gold));
      font-weight: 900;
      text-shadow: 0 0 8px rgba(var(--gold), .35);
      font-size: clamp(12px, 1.35vw, 18px);
    }

    .resource {
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      padding: 0 7px 0 12px;
      font-weight: 900;
      letter-spacing: .02em;
      font-size: clamp(11px, 1.2vw, 16px);
      white-space: nowrap;
    }

    .res-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }

    .res-icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: rgb(var(--rgb));
      text-shadow: 0 0 10px rgba(var(--rgb), .85);
      font-size: 18px;
      flex: 0 0 auto;
    }

    .plus {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 6px;
      background: rgba(255,255,255,.07);
      color: #fff;
      box-shadow: inset 0 0 8px rgba(var(--rgb), .1);
      flex: 0 0 auto;
    }


    /* v10: валюта без овалов, иконок и плюсов — оставляем только цифры. */
    .resource {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      justify-content: center;
      padding: 0;
      overflow: visible;
      color: #ffffff;
      text-shadow: 0 0 9px rgba(var(--rgb), .72), 0 1px 2px rgba(0,0,0,.75);
      font-size: clamp(12px, 1.22vw, 17px);
    }

    .resource:hover,
    .resource:focus-visible,
    .resource.is-active {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      filter: none !important;
      transform: none !important;
    }

    .resource::before,
    .resource::after {
      display: none !important;
    }

    .resource .res-icon,
    .resource .plus {
      display: none !important;
    }

    .resource .res-left {
      justify-content: center;
      gap: 0;
      overflow: visible;
    }

    .top-icon {
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: clamp(17px, 1.7vw, 25px);
      font-weight: 900;
      background: rgba(3, 8, 20, .38);
      border-color: transparent;
      backdrop-filter: none;
      box-shadow: none;
    }

    .top-icon .badge {
      position: absolute;
      right: 4px;
      top: 2px;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #ff2b76;
      box-shadow: 0 0 9px rgba(255, 43, 118, .8);
      border: 1px solid #fff;
    }

    .event-card {
      border-radius: 8px;
      padding: 9px 12px;
      text-align: left;
      white-space: normal;
      clip-path: polygon(0 0, 94% 0, 100% 20%, 100% 100%, 0 100%);
      background: linear-gradient(135deg, rgba(20, 5, 42, .62), rgba(4, 14, 32, .54)) !important;
      border-color: rgba(var(--pink), .48) !important;
      box-shadow: 0 0 18px rgba(var(--pink), .16), inset 0 0 18px rgba(var(--pink), .06) !important;
    }

    .event-card::after {
      display: none !important;
    }

    .event-kicker,
    .event-title,
    .event-time {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-kicker {
      color: #ff8cff;
      text-transform: uppercase;
      font-weight: 900;
      font-size: clamp(8px, .76vw, 11px);
      letter-spacing: .08em;
      text-shadow: 0 0 10px rgba(var(--pink), .72);
      line-height: 1;
    }

    .event-title {
      margin-top: 5px;
      color: #ffffff;
      font-size: clamp(11px, 1.04vw, 15px);
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
    }

    .event-time {
      margin-top: 6px;
      color: rgba(236,251,255,.82);
      font-size: clamp(7px, .68vw, 10px);
      font-weight: 750;
      white-space: nowrap;
    }

    .side-btn {
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 11px;
      background: rgba(2, 8, 20, .28);
      border-color: transparent;
      text-align: left;
    }

    .side-icon {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      color: #dffbff;
      font-size: clamp(15px, 1.35vw, 21px);
      text-shadow: 0 0 12px rgba(var(--cyan), .8);
      flex: 0 0 auto;
    }

    .side-label {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .025em;
      font-size: clamp(9px, .95vw, 13px);
      color: #effcff;
      text-shadow: 0 0 9px rgba(var(--cyan), .25);
    }

    .new-badge {
      margin-left: 8px;
      color: #ff6ef2;
      font-size: clamp(7px, .68vw, 10px);
      font-weight: 900;
      text-shadow: 0 0 10px rgba(var(--pink), .85);
    }

    .bottom-shell {
      --x: 8;
      --y: 680;
      --w: 865;
      --h: 78;
      position: absolute;
      left: calc(var(--x) / var(--bg-w) * 100%);
      top: calc(var(--y) / var(--bg-h) * 100%);
      width: calc(var(--w) / var(--bg-w) * 100%);
      height: calc(var(--h) / var(--bg-h) * 100%);
      z-index: 28;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(7, 28, 58, .72), rgba(5, 15, 32, .66));
      border: 1px solid rgba(var(--cyan), .20);
      clip-path: polygon(0 0, 100% 0, 97% 100%, 0 100%);
      box-shadow: 0 -8px 25px rgba(0,0,0,.42), 0 0 22px rgba(var(--cyan), .08), inset 0 0 25px rgba(var(--cyan), .09);
    }

    .bottom-nav {
      border-radius: 0;
      background: rgba(4, 18, 42, .54);
      border-color: rgba(var(--cyan), .18);
      border-top-color: transparent;
      border-bottom-color: transparent;
      display: grid;
      place-items: center;
      gap: 3px;
      padding: 6px 4px;
      text-align: center;
    }

    .bottom-nav.home {
      background: linear-gradient(135deg, rgba(0, 133, 199, .66), rgba(9, 50, 86, .82));
      clip-path: polygon(0 0, 80% 0, 100% 100%, 0 100%);
      border-color: rgba(var(--cyan), .35);
    }

    .nav-icon {
      font-size: clamp(18px, 2vw, 28px);
      line-height: 1;
      text-shadow: 0 0 12px rgba(var(--cyan), .65);
    }

    .nav-label {
      font-size: clamp(10px, 1vw, 14px);
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 9px rgba(var(--cyan), .55), 0 1px 2px rgba(0,0,0,.8);
    }

    .hud {
      position: absolute;
      left: 300px;
      bottom: 86px;
      z-index: 40;
      max-width: min(520px, calc(100% - 36px));
      padding: 10px 13px;
      border: 1px solid rgba(var(--cyan), .24);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(2, 8, 22, .56), rgba(25, 4, 35, .46));
      backdrop-filter: blur(10px);
      box-shadow: 0 0 22px rgba(0,0,0,.38), inset 0 0 18px rgba(var(--cyan), .04);
      font-size: clamp(11px, 1vw, 14px);
      line-height: 1.35;
      pointer-events: none;
      opacity: .86;
    }

    .hud strong {
      color: #fff;
      text-shadow: 0 0 10px rgba(var(--pink), .75);
    }

    .hud span { color: rgba(236, 251, 255, .74); }

    .debug {
      position: absolute;
      right: 14px;
      top: 58px;
      z-index: 45;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }

    .debug button {
      pointer-events: all;
      border: 1px solid rgba(var(--cyan), .34);
      color: #edfcff;
      background: rgba(4, 10, 25, .58);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 16px rgba(var(--cyan), .12);
    }

    .debug button:hover { border-color: rgba(var(--pink), .9); }

    .stage.hide-labels .sprite-label { display: none; }

    .stage.editor .sprite-btn,
    .stage.editor .ui-hot {
      outline: 1px dashed rgba(var(--cyan), .5);
      background-color: rgba(var(--cyan), .045);
    }

    .ripple {
      position: absolute;
      width: 24px;
      height: 24px;
      margin: -12px 0 0 -12px;
      border: 2px solid rgba(var(--ripple-rgb), .96);
      border-radius: 999px;
      z-index: 60;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(var(--ripple-rgb), .95));
      animation: ripple .78s ease-out forwards;
    }

    @keyframes spriteFloat {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-5px) rotate(.2deg); }
    }

    @keyframes auraPulse {
      from { opacity: .58; }
      to { opacity: 1; }
    }

    @keyframes scan {
      from { transform: translateX(-72%) skewX(-10deg); opacity: 0; }
      22% { opacity: .85; }
      to { transform: translateX(72%) skewX(-10deg); opacity: 0; }
    }

    @keyframes uiScan {
      from { transform: translateX(-35%); opacity: 0; }
      24% { opacity: .85; }
      to { transform: translateX(38%); opacity: 0; }
    }

    @keyframes ripple {
      from { transform: scale(.55); opacity: 1; }
      to { transform: scale(7); opacity: 0; }
    }

    /*
      MOBILE v9
      Возвращаем полный экран: сцена занимает весь viewport без квадратов и без принудительного поворота.
      Для webview с Close слева и ⋮ справа на мобильной версии отдельно переносим валюты вверх по центру.
    */
    @media (max-width: 1024px), (max-height: 560px) {
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #020611;
      }

      body { display: block; }

      .stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        max-height: none;
        transform: none;
        box-shadow: none;
      }

      .bg { object-fit: fill; }
      .hud { display: none !important; }

      /* Валюта только на mobile: вверх и по центру, между Close и ⋮. */
      .resource[data-name="Energy"]  { --x: 415 !important; --y: 10 !important; --w: 160 !important; --h: 38 !important; }
      .resource[data-name="Credits"] { --x: 590 !important; --y: 10 !important; --w: 190 !important; --h: 38 !important; }
      .resource[data-name="Crystals"]{ --x: 795 !important; --y: 10 !important; --w: 150 !important; --h: 38 !important; }

  
    /* v10: валюта без овалов, иконок и плюсов — оставляем только цифры. */
    .resource {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      justify-content: center;
      padding: 0;
      overflow: visible;
      color: #ffffff;
      text-shadow: 0 0 9px rgba(var(--rgb), .72), 0 1px 2px rgba(0,0,0,.75);
      font-size: clamp(12px, 1.22vw, 17px);
    }

    .resource:hover,
    .resource:focus-visible,
    .resource.is-active {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      filter: none !important;
      transform: none !important;
    }

    .resource::before,
    .resource::after {
      display: none !important;
    }

    .resource .res-icon,
    .resource .plus {
      display: none !important;
    }

    .resource .res-left {
      justify-content: center;
      gap: 0;
      overflow: visible;
    }

    .top-icon { display: none !important; }

      .profile-card { --x: 18 !important; --y: 54 !important; --w: 300 !important; --h: 76 !important; }
      .event-card { --x: 18 !important; --y: 138 !important; --w: 300 !important; --h: 82 !important; }

      .event-title { font-size: clamp(9px, 2vw, 14px); }
      .event-kicker, .event-time { font-size: clamp(7px, 1.55vw, 10px); }

      .side-btn { --w: 260 !important; }
      .side-label { font-size: clamp(8px, 1.85vw, 12px); }
      .new-badge { font-size: clamp(7px, 1.45vw, 9px); margin-left: 5px; }

      .bottom-shell {
        --y: 670 !important;
        --h: 88 !important;
        background: linear-gradient(90deg, rgba(7, 28, 58, .62), rgba(5, 15, 32, .58));
        box-shadow: 0 -8px 22px rgba(0,0,0,.38), inset 0 0 18px rgba(var(--cyan), .08);
      }

      .bottom-nav {
        --y: 670 !important;
        --h: 88 !important;
        background: rgba(4, 18, 42, .74);
        border-color: rgba(var(--cyan), .28);
      }

      .nav-icon { font-size: clamp(17px, 4vw, 28px); }
      .nav-label { font-size: clamp(8px, 2vw, 13px); color: #fff; }

      .sprite-btn.main-story { --x: 1010 !important; --y: 640 !important; --w: 390 !important; }
    }

    body.mobile-safe-plus {
      --mobile-top-gap: 78px;
      --mobile-bottom-gap: 0px;
    }
  </style>
</head>

<body>
  <main class="stage" id="stage" aria-label="Главная база">
    <!-- main_menu.html лежит внутри webapp, поэтому пути относительные: ./cyber_base_sprite_assets/... -->
    <img
      class="bg"
      id="baseBg"
      src="./cyber_base_sprite_assets/bg_clean_final.jpg"
      data-candidates="./cyber_base_sprite_assets/bg_clean_final.jpg|./cyber_base_sprite_assets/bg_clean_final.jpeg|./cyber_base_sprite_assets/bg_clean_final.png|./cyber_base_sprite_assets/base_cyberpunk.jpg"
      alt="Фон базы"
      draggable="false"
    />
    <div class="ambient"></div>

    <audio id="menuMusic" src="./assets/audio/music/neon_soul.mp3" loop preload="auto"></audio>

    <!-- Main interactive base objects -->
    <button class="sprite-btn dungeons" style="--x: 150; --y: 365; --w: 440; --rgb: 0, 229, 255; --z: 4;" data-name="Dungeons" data-action="Explore. Fight. Ascend." aria-label="Dungeons" type="button">
      <img class="sprite-art" src="./cyber_base_sprite_assets/dungeons.png" alt="Dungeons" draggable="false" />

    </button>

    <button class="sprite-btn summon" style="--x: 600; --y: 120; --w: 320; --rgb: 255, 43, 222; --z: 5;" data-name="Summon" data-action="Clone. Summon. Awaken." aria-label="Summon" type="button">
      <img class="sprite-art" src="./cyber_base_sprite_assets/summon.png" alt="Summon" draggable="false" />
      <span class="sprite-label">Summon</span>
    </button>

    <button class="sprite-btn bar" style="--x: 965; --y: 40; --w: 415; --rgb: 255, 43, 222; --z: 4;" data-name="Afterlife Bar" data-action="Drink. Relax. Connect." aria-label="Afterlife Bar" type="button">
      <img class="sprite-art" src="./cyber_base_sprite_assets/bar.png" alt="Afterlife Bar" draggable="false" />
      <span class="sprite-label">Afterlife Bar</span>
    </button>

    <button class="sprite-btn cyberware" style="--x: 835; --y: 405; --w: 475; --rgb: 0, 229, 255; --z: 6;" data-name="Cyberware" data-action="Enhance. Upgrade. Evolve." aria-label="Cyberware" type="button">
      <img class="sprite-art" src="./cyber_base_sprite_assets/cyberware.png" alt="Cyberware" draggable="false" />
      <span class="sprite-label">Cyberware</span>
    </button>

    <button class="sprite-btn main-story" style="--x: 1010; --y: 640; --w: 390; --rgb: 255, 43, 222; --z: 7;" data-name="Main Story" data-action="Chapter 12-5" aria-label="Main Story" type="button">
      <img class="sprite-art" src="./cyber_base_sprite_assets/main_story.png" alt="Main Story" draggable="false" />
      <span class="sprite-label">Main Story</span>
    </button>

    <!-- Old UI buttons restored as real interactive elements -->
    <section class="ui-layer" aria-label="Интерфейс главной базы">
      <!-- Profile -->
      <button class="ui-hot profile-card" style="--x: 18; --y: 5; --w: 320; --h: 88; --rgb: 255, 43, 222;" data-name="Profile" data-action="Nightshade · Lv. 68 · Power 256,800" aria-label="Profile" type="button">
        <span class="avatar has-image" aria-hidden="true"><img src="./cyber_base_sprite_assets/avatar_nightshade.png" alt="" draggable="false"></span>
        <span class="profile-name">Nightshade <small>Lv. 68</small></span>
        <span class="xp-line"><span class="xp-fill"></span></span>
        <span class="power">◆ 256,800</span>
      </button>

      <!-- Resources -->
      <button class="ui-hot resource" style="--x: 470; --y: 18; --w: 170; --h: 38; --rgb: 0, 229, 255;" data-name="Energy" data-action="120 / 120" aria-label="Energy" type="button">
        <span class="res-left"><span class="res-icon">⚡</span><span>120 / 120</span></span><span class="plus">＋</span>
      </button>

      <button class="ui-hot resource" style="--x: 655; --y: 18; --w: 190; --h: 38; --rgb: 255, 213, 95;" data-name="Credits" data-action="2,450,790" aria-label="Credits" type="button">
        <span class="res-left"><span class="res-icon">⬡</span><span>2,450,790</span></span><span class="plus">＋</span>
      </button>

      <button class="ui-hot resource" style="--x: 865; --y: 18; --w: 150; --h: 38; --rgb: 156, 81, 255;" data-name="Crystals" data-action="8,960" aria-label="Crystals" type="button">
        <span class="res-left"><span class="res-icon">⬢</span><span>8,960</span></span><span class="plus">＋</span>
      </button>

      <!-- Top-right icons -->
      <button class="ui-hot top-icon" style="--x: 1110; --y: 16; --w: 44; --h: 44; --rgb: 255, 43, 222;" data-name="Mail" data-action="Open inbox" aria-label="Mail" type="button">✉<span class="badge" aria-hidden="true"></span></button>
      <button class="ui-hot top-icon" style="--x: 1180; --y: 16; --w: 44; --h: 44; --rgb: 0, 229, 255;" data-name="Friends" data-action="Social hub" aria-label="Friends" type="button">♟</button>
      <button class="ui-hot top-icon" style="--x: 1250; --y: 16; --w: 44; --h: 44; --rgb: 0, 229, 255;" data-name="Settings" data-action="Game settings" aria-label="Settings" type="button">⚙</button>
      <button class="ui-hot top-icon" style="--x: 1320; --y: 16; --w: 44; --h: 44; --rgb: 0, 229, 255;" data-name="Network" data-action="Connection status" aria-label="Network" type="button">⌁</button>

      <!-- Event card -->
      <button class="ui-hot event-card" style="--x: 18; --y: 112; --w: 275; --h: 88; --rgb: 255, 43, 222;" data-name="Event: Neon Uprising" data-action="8D 12H Left" aria-label="Event Neon Uprising" type="button">
        <span class="event-kicker">Event</span>
        <span class="event-title">Neon Uprising</span>
        <span class="event-time">◷ 8D 12H Left</span>
      </button>

      <!-- Left navigation -->
      <button class="ui-hot side-btn" style="--x: 20; --y: 220; --w: 235; --h: 48; --rgb: 0, 229, 255;" data-name="Missions" data-action="Open missions" aria-label="Missions" type="button"><span class="side-icon">▣</span><span class="side-label">Missions</span></button>
      <button class="ui-hot side-btn" style="--x: 20; --y: 275; --w: 255; --h: 48; --rgb: 0, 229, 255;" data-name="Battle Pass" data-action="Season rewards" aria-label="Battle Pass" type="button"><span class="side-icon">✺</span><span class="side-label">Battle Pass</span><span class="new-badge">NEW</span></button>
      <button class="ui-hot side-btn" style="--x: 20; --y: 330; --w: 235; --h: 48; --rgb: 0, 229, 255;" data-name="Store" data-action="Open store" aria-label="Store" type="button"><span class="side-icon">🛒</span><span class="side-label">Store</span></button>
      <button class="ui-hot side-btn" style="--x: 20; --y: 385; --w: 250; --h: 48; --rgb: 0, 229, 255;" data-name="Inventory" data-action="Open inventory" aria-label="Inventory" type="button"><span class="side-icon">▤</span><span class="side-label">Inventory</span></button>

      <!-- Bottom nav shell + buttons -->
      <div class="bottom-shell" aria-hidden="true"></div>
      <button class="ui-hot bottom-nav home" style="--x: 10; --y: 682; --w: 175; --h: 76; --rgb: 0, 229, 255;" data-name="Home" data-action="Current section" aria-label="Home" type="button"><span class="nav-icon">✥</span><span class="nav-label">Home</span></button>
      <button class="ui-hot bottom-nav" style="--x: 190; --y: 682; --w: 135; --h: 76; --rgb: 0, 229, 255;" data-name="Agents" data-action="Manage agents" aria-label="Agents" type="button"><span class="nav-icon">☣</span><span class="nav-label">Agents</span></button>
      <button class="ui-hot bottom-nav" style="--x: 326; --y: 682; --w: 135; --h: 76; --rgb: 255, 43, 222;" data-name="Squad" data-action="Team setup" aria-label="Squad" type="button"><span class="nav-icon">♟</span><span class="nav-label">Squad</span></button>
      <button class="ui-hot bottom-nav" style="--x: 462; --y: 682; --w: 135; --h: 76; --rgb: 0, 229, 255;" data-name="Tech" data-action="Tech upgrades" aria-label="Tech" type="button"><span class="nav-icon">▧</span><span class="nav-label">Tech</span></button>
      <button class="ui-hot bottom-nav" style="--x: 598; --y: 682; --w: 135; --h: 76; --rgb: 0, 229, 255;" data-name="Codex" data-action="Game codex" aria-label="Codex" type="button"><span class="nav-icon">◈</span><span class="nav-label">Codex</span></button>
      <button class="ui-hot bottom-nav" style="--x: 734; --y: 682; --w: 135; --h: 76; --rgb: 0, 229, 255;" data-name="Corp" data-action="Corporation" aria-label="Corp" type="button"><span class="nav-icon">⌂</span><span class="nav-label">Corp</span></button>
    </section>

    <div class="hud" id="hud">
      <strong>Главная база.</strong>
      <span> v10: валюта без овалов/плюсов, event и левое меню ужаты, Main Story прижата к нижнему правому углу, тап по фону снимает active.</span>
    </div>
  </main>

  <script>
    const stage = document.getElementById('stage');
    const hud = document.getElementById('hud');
    const menuMusic = document.getElementById('menuMusic');
    const baseBg = document.getElementById('baseBg');
    const hotElements = [...document.querySelectorAll('.sprite-btn, .ui-hot')];

    // Фон: сначала пробуем новый JPG, потом JPEG/PNG/base_cyberpunk.
    // Это спасает, если в репозитории расширение отличается от ожидаемого.
    const bgCandidates = (baseBg.dataset.candidates || '').split('|').filter(Boolean);
    let bgIndex = 0;
    baseBg.addEventListener('error', () => {
      bgIndex += 1;
      if (bgCandidates[bgIndex]) baseBg.src = bgCandidates[bgIndex];
      else console.warn('Base background was not found. Check file path:', bgCandidates);
    });

    // Музыка меню. Браузеры часто блокируют autoplay, поэтому
    // сначала пробуем запустить сразу, а если нельзя — запускаем после первого клика/тапа/клавиши.
    menuMusic.volume = 0.42;

    async function startMenuMusic() {
      if (!menuMusic.paused) return;
      try {
        await menuMusic.play();
      } catch (error) {
        // Autoplay blocked. Нормально: музыка стартанёт после первого взаимодействия.
      }
    }

    startMenuMusic();
    ['pointerdown', 'click', 'touchstart', 'keydown'].forEach(eventName => {
      document.addEventListener(eventName, startMenuMusic, { once: true, passive: true });
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) startMenuMusic();
    });

    // Если меню открыто как Telegram/WebApp, просим контейнер раскрыться на максимум.
    // Если объекта Telegram нет — код просто ничего не делает.
    try {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        if (typeof tg.requestFullscreen === 'function') tg.requestFullscreen();
        if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();

        // При изменении высоты webview ещё раз просим раскрыть окно.
        if (typeof tg.onEvent === 'function') {
          tg.onEvent('viewportChanged', () => {
            try { tg.expand(); } catch (error) {}
          });
        }
      }
    } catch (error) {}

    function rgbOf(el) {
      const raw = (el.getAttribute('style') || '').match(/--rgb:\s*([^;]+)/);
      return raw ? raw[1].trim() : '0, 229, 255';
    }

    function setHud(el) {
      hud.innerHTML = `<strong>${el.dataset.name}</strong><span> — ${el.dataset.action}</span>`;
    }

    function updateMouseVars(el, event) {
      const rect = el.getBoundingClientRect();
      const mx = ((event.clientX - rect.left) / rect.width) * 100;
      const my = ((event.clientY - rect.top) / rect.height) * 100;
      el.style.setProperty('--mx', `${mx}%`);
      el.style.setProperty('--my', `${my}%`);
    }

    function tapFX(el, x, y) {
      hotElements.forEach(item => item.classList.remove('is-active'));
      el.classList.add('is-active');
      setHud(el);

      if (Number.isFinite(x) && Number.isFinite(y)) {
        const rect = stage.getBoundingClientRect();
        const ripple = document.createElement('i');
        ripple.className = 'ripple';
        ripple.style.left = `${x - rect.left}px`;
        ripple.style.top = `${y - rect.top}px`;
        ripple.style.setProperty('--ripple-rgb', rgbOf(el));
        stage.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      }

      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.classList.remove('is-active');
      }, 1100);
    }



    function clearActiveSelection() {
      hotElements.forEach(item => item.classList.remove('is-active'));
    }

    // Mobile/desktop: тап по фону снимает выделение с активной кнопки.
    stage.addEventListener('pointerdown', event => {
      if (!event.target.closest('.sprite-btn, .ui-hot')) {
        clearActiveSelection();
      }
    });
    hotElements.forEach(el => {
      el.addEventListener('pointerenter', event => {
        updateMouseVars(el, event);
        setHud(el);
      });

      el.addEventListener('pointermove', event => {
        updateMouseVars(el, event);
      });

      el.addEventListener('pointerdown', event => {
        updateMouseVars(el, event);
        tapFX(el, event.clientX, event.clientY);
      });

      el.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          tapFX(el, NaN, NaN);
        }
      });
    });
  </script>
</body>
</html>
