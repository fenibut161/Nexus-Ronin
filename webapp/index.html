<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Ronin — Fullscreen Test</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.4s;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #game {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-size: 24px;
    }
    #game.active {
      display: flex;
    }
    .btn {
      padding: 16px 40px;
      font-size: 20px;
      background: #ffd36a;
      color: #0a0a1a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }
    #status {
      color: #aaa;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }
    .highlight { color: #22e7ff; }
  </style>
</head>
<body>

<div id="splash">
  <h1 style="font-size: 48px;">NEXUS <span style="color:#ffd36a;">RONIN</span></h1>
  <button class="btn" id="startBtn">Начать</button>
  <div id="status">Нажмите кнопку для входа</div>
</div>

<div id="game">
  <div>🎮 <span class="highlight">ИГРА ЗАПУЩЕНА</span></div>
  <div style="font-size: 16px; color:#aaa;">Полноэкранный режим должен быть активен</div>
  <button class="btn" id="exitBtn" style="background:#666; color:#fff;">Выйти</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  let tg = null;
  const splash = document.getElementById('splash');
  const game = document.getElementById('game');
  const statusDiv = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const exitBtn = document.getElementById('exitBtn');

  // Инициализация Telegram WebApp
  function initTelegram() {
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();  // сразу растягиваем
      console.log('Telegram WebApp инициализирован');
      statusDiv.innerHTML = '✅ Telegram WebApp готов';
      return true;
    } else {
      statusDiv.innerHTML = '⚠️ Запущено вне Telegram (или WebApp не загружен)';
      return false;
    }
  }
  initTelegram();

  // Функция перехода в игру
  function enterGame() {
    splash.classList.add('hidden');
    game.classList.add('active');
    // Попробуем запустить fullscreen (если ещё не включен)
    if (tg && tg.requestFullscreen) {
      tg.requestFullscreen().catch(() => {
        // Если не вышло, просто используем expand
        tg.expand();
      });
    }
    statusDiv.innerHTML = '🔥 Игра активна';
  }

  // Обработчик кнопки "Начать"
  startBtn.addEventListener('click', function() {
    statusDiv.innerHTML = '⏳ Запрос полного экрана...';

    // Сначала запрашиваем fullscreen, потом переходим
    if (tg && tg.requestFullscreen) {
      tg.requestFullscreen()
        .then(() => {
          statusDiv.innerHTML = '✅ Fullscreen включён';
          enterGame();
        })
        .catch((err) => {
          console.warn('Fullscreen не удался:', err);
          statusDiv.innerHTML = '⚠️ Fullscreen недоступен, используем expand';
          tg.expand();
          enterGame();
        });
    } else {
      // Если requestFullscreen нет, просто expand и переходим
      if (tg) tg.expand();
      enterGame();
    }
  });

  // Выход (для теста)
  exitBtn.addEventListener('click', function() {
    splash.classList.remove('hidden');
    game.classList.remove('active');
    statusDiv.innerHTML = 'Вы вышли из игры';
    if (tg && tg.exitFullscreen) {
      tg.exitFullscreen().catch(() => {});
    }
  });
</script>
</body>
</html>
