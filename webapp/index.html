<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS RONIN — Loading Screen</title>
  <style>
    :root {
      /* Безопасные отступы от плавающих кнопок Telegram [X Закрыть] и [...] */
      --safe-top: max(60px, var(--tg-content-safe-area-inset-top, 60px));
      --safe-bottom: max(20px, var(--tg-content-safe-area-inset-bottom, 20px));
      --cyan: #00f0ff;
      --pink: #ff007b;
      --gold: #ffd36a;
      --dark-bg: #060913;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--dark-bg);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* === АНИМИРОВАННЫЙ ФОН СО СЛАЙДАМИ === */
    #bgSliderContainer {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      z-index: 1;
      background: var(--dark-bg);
    }

    .slide-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s ease-in-out, transform 6s ease;
      background-size: cover;
      background-position: center;
      transform: scale(1);
      filter: brightness(0.68) contrast(1.15);
    }
    .slide-layer.active {
      opacity: 1;
      transform: scale(1.06);
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        rgba(6,9,19,0.85) 0%,
        rgba(6,9,19,0.2) 30%,
        rgba(6,9,19,0.65) 65%,
        rgba(6,9,19,0.98) 100%
      );
    }

    /* === ОСНОВНОЙ КОНТЕЙНЕР ЭКРАНА ЗАГРУЗКИ === */
    #loadingScreen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Логотип NEXUS RONIN */
    .header-logo-container {
      margin-top: calc(var(--safe-top) + 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .nr-badge {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(180, 0, 255, 0.35));
      border: 1px solid var(--cyan);
      padding: 5px 16px;
      font-size: 22px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 2px;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      margin-bottom: 10px;
    }

    .game-subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 3px;
      text-shadow: 0 0 8px var(--cyan);
    }

    .game-title {
      font-size: 38px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 1px;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.8);
    }
    .game-title .nexus { color: #ffffff; }
    .game-title .ronin { color: var(--gold); text-shadow: 0 0 15px rgba(255, 211, 106, 0.6); }

    /* Блок подсказок по лору в центре */
    .lore-slide-box {
      margin: auto 20px;
      padding: 16px 22px;
      background: rgba(6, 12, 24, 0.78);
      border-left: 3px solid var(--cyan);
      border-right: 3px solid var(--pink);
      border-radius: 10px;
      max-width: 380px;
      width: calc(100% - 40px);
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }
    .lore-title {
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .lore-text {
      font-size: 13.5px;
      color: #e2e8f0;
      line-height: 1.45;
      min-height: 40px;
      transition: opacity 0.4s ease;
    }

    /* Нижняя панель синхронизации и кнопок */
    .loading-bottom-box {
      width: calc(100% - 32px);
      max-width: 420px;
      margin-bottom: calc(var(--safe-bottom) + 30px);
    }

    .cyber-box {
      background: rgba(6, 12, 24, 0.94);
      border: 1px solid rgba(0, 240, 255, 0.45);
      padding: 20px;
      position: relative;
      clip-path: polygon(15px 0%, 100% 0%, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0% 100%, 0% 15px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 240, 255, 0.12);
      backdrop-filter: blur(14px);
    }

    .sync-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff 0%, #ff007b 50%, #ffd36a 100%);
      box-shadow: 0 0 12px rgba(255, 0, 123, 0.8);
      transition: width 0.25s ease;
    }

    .sync-status {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 16px;
    }

    /* Киберпанк кнопки */
    .cyber-btn {
      width: 100%;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    }

    .cyber-btn:active:not(:disabled) { transform: scale(0.97); }

    /* Состояние заблокированной кнопки НАЧАТЬ до 100% */
    .btn-primary:disabled {
      background: linear-gradient(90deg, #333d4d 0%, #252d3a 100%);
      color: #7a869a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
    }

    /* Состояние активной кнопки НАЧАТЬ при 100% */
    .btn-primary:not(:disabled) {
      background: linear-gradient(90deg, #ffe082 0%, #ffd36a 50%, #ffaf00 100%);
      color: #060913;
      margin-bottom: 10px;
      box-shadow: 0 0 20px rgba(255, 211, 106, 0.6);
      animation: pulseBtn 1.8s infinite;
    }

    @keyframes pulseBtn {
      0% { box-shadow: 0 0 15px rgba(255, 211, 106, 0.5); }
      50% { box-shadow: 0 0 28px rgba(255, 211, 106, 0.9); }
      100% { box-shadow: 0 0 15px rgba(255, 211, 106, 0.5); }
    }

    .btn-primary { margin-bottom: 10px; }

    .btn-secondary {
      background: rgba(10, 25, 45, 0.75);
      color: #fff;
      border: 1px solid rgba(0, 240, 255, 0.4);
    }
    .btn-secondary:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: var(--cyan);
    }

    .build-version {
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 12px;
    }
  </style>
</head>
<body>

<!-- Контейнер для 6 сменяющихся картинок фона -->
<div id="bgSliderContainer"></div>
<div class="loading-overlay"></div>

<div id="loadingScreen">
  <!-- Логотип NEXUS RONIN -->
  <div class="header-logo-container">
    <div class="nr-badge">NR</div>
    <div class="game-subtitle">LEGENDARY CYBERPUNK RPG</div>
    <div class="game-title">
      <div class="nexus">NEXUS</div>
      <div class="ronin">RONIN</div>
    </div>
  </div>

  <!-- Подсказки по лору игры -->
  <div class="lore-slide-box">
    <div class="lore-title" id="loreTitle">⚡ СИСТЕМА: НЕО-ТОКИО</div>
    <div class="lore-text" id="loreText">Инициализация нейроинтерфейса. Ронин готовится к подключению...</div>
  </div>

  <!-- Панель синхронизации (Без ресурсов!) -->
  <div class="loading-bottom-box">
    <div class="cyber-box">
      <div class="sync-header">
        <span style="color:#fff;">СИНХРОНИЗАЦИЯ</span>
        <span style="color:var(--gold);" id="syncPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="sync-status" id="syncStatusText">Загрузка нейроядер...</div>

      <!-- КНОПКА НАЧАТЬ (ЗАБЛОКИРОВАНА ДО 100%) -->
      <button class="cyber-btn btn-primary" id="startBtn" disabled>🔒 СИНХРОНИЗАЦИЯ...</button>
      <button class="cyber-btn btn-secondary" id="settingsBtn">НАСТРОЙКИ</button>
    </div>
    <div class="build-version">PROTOTYPE BUILD 0.1</div>
  </div>
</div>

<!-- Официальный скрипт Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram?.WebApp;

  // =========================================================================
  // НАСТРОЙКИ ФОНОВЫХ ИЗОБРАЖЕНИЙ (ОТДЕЛЬНО ОТ ОБОЛОЧКИ)
  // Вы можете заменять файлы 1.png - 6.png в репозитории, не меняя этот код!
  // =========================================================================
  const BACKGROUND_SLIDES = [
    'webapp/assets/images/backgrounds/1.png',
    'webapp/assets/images/backgrounds/2.png',
    'webapp/assets/images/backgrounds/3.png',
    'webapp/assets/images/backgrounds/4.png',
    'webapp/assets/images/backgrounds/5.png',
    'webapp/assets/images/backgrounds/6.png'
  ];

  // Данные для подсказок по лору
  const LORE_DATA = [
    { title: "⚡ СИСТЕМА: НЕО-ТОКИО", text: "Мегаполис никогда не спит. Под неоновым дождём корпорации ведут тайные войны за контроль над нейросетью." },
    { title: "🧬 СЕКРЕТНЫЕ ЛАБОРАТОРИИ", text: "Биоинженерия достигла абсолюта. Кибернетические импланты и плазменное оружие создаются в недрах мега-башен." },
    { title: "⚔️ ПУТЬ РОНИНА", text: "Самурай без сузерена в киберпространстве. Только катана, быстрые рефлексы и верность собственному кодексу." },
    { title: "🥋 ПОДПОЛЬНЫЕ АРЕНЫ", text: "В подземных додзё бойцы оттачивают мастерство владения энергоклинками в поединках насмерть." },
    { title: "🌐 ТАКТИЧЕСКИЕ ЦЕНТРЫ", text: "С высоты пентхаусов хакеры Синдиката управляют потоками данных, взламывая протоколы безопасности." },
    { title: "🔮 ЯДРО NEXUS CORE", text: "Сердце вселенной. Квантовый реактор, хранящий сознание величайших воинов прошлого для Призыва." }
  ];

  // 1. Инициализация Telegram WebApp
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#060913');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#060913');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }

  // 2. Динамическое создание слоёв фона
  const sliderContainer = document.getElementById('bgSliderContainer');
  const slideElements = [];

  BACKGROUND_SLIDES.forEach((url, idx) => {
    const layer = document.createElement('div');
    layer.className = `slide-layer ${idx === 0 ? 'active' : ''}`;
    layer.style.backgroundImage = `url('${url}')`;
    sliderContainer.appendChild(layer);
    slideElements.push(layer);
  });

  // 3. Анимация смены фонов и лора
  let activeIdx = 0;
  const loreTitle = document.getElementById('loreTitle');
  const loreText = document.getElementById('loreText');

  setInterval(() => {
    slideElements[activeIdx].classList.remove('active');
    activeIdx = (activeIdx + 1) % slideElements.length;
    slideElements[activeIdx].classList.add('active');

    loreText.style.opacity = 0;
    setTimeout(() => {
      loreTitle.textContent = LORE_DATA[activeIdx].title;
      loreText.textContent = LORE_DATA[activeIdx].text;
      loreText.style.opacity = 1;
    }, 350);
  }, 4500);

  // 4. Процесс синхронизации 0% -> 100%
  const startBtn = document.getElementById('startBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const syncPercent = document.getElementById('syncPercent');
  const progressFill = document.getElementById('progressFill');
  const syncStatusText = document.getElementById('syncStatusText');

  let currentProgress = 0;
  const syncMessages = [
    { p: 15, text: "Инициализация нейроинтерфейса..." },
    { p: 40, text: "Загрузка архитектуры Нео-Токио..." },
    { p: 65, text: "Подключение к ядру Nexus Core..." },
    { p: 85, text: "Калибровка боевых имплантов..." },
    { p: 100, text: "Синхронизация завершена" }
  ];

  const syncInterval = setInterval(() => {
    currentProgress += Math.floor(Math.random() * 6) + 3;
    if (currentProgress >= 100) {
      currentProgress = 100;
      clearInterval(syncInterval);

      // РАЗБЛОКИРУЕМ КНОПКУ ТОЛЬКО ПРИ 100%
      startBtn.disabled = false;
      startBtn.innerHTML = "⚡ НАЧАТЬ";
      syncStatusText.textContent = "Готово к погружению";
      syncStatusText.style.color = "#ffd36a";
    }

    syncPercent.textContent = `${currentProgress}%`;
    progressFill.style.width = `${currentProgress}%`;

    for (let msg of syncMessages) {
      if (currentProgress <= msg.p && currentProgress > msg.p - 15) {
        syncStatusText.textContent = msg.text;
        break;
      }
    }
  }, 100);

  // 5. Обработчики кнопок
  startBtn.addEventListener('click', () => {
    if (startBtn.disabled) return;

    // Запрашиваем Fullscreen при нажатии НАЧАТЬ
    if (tg && typeof tg.requestFullscreen === 'function') {
      try { tg.requestFullscreen(); } catch (e) { console.warn(e); }
    }

    // Переходим в отдельный файл Главного меню
    window.location.href = 'main_menu.html';
  });

  settingsBtn.addEventListener('click', () => {
    alert("Настройки системы Nexus Ronin");
  });
</script>
