<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<title>Nexus Ronin</title>
<style>
/* ---- Сброс ---- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:#fff;
  touch-action:pan-x pan-y;
}

/* ---- Splash (загрузка) ---- */
#splash {
  position:fixed;inset:0;z-index:10;
  background:#02040a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity 0.8s ease;
}
#splash.hidden { opacity:0; pointer-events:none; }

.bg {
  position:absolute;inset:0;
  background:url('./assets/images/backgrounds/main_menu_bg.jpg') center/cover no-repeat;
  transform:scale(1.03);
  animation:bgMove 9s ease-in-out infinite alternate;
}
@keyframes bgMove{
  from{transform:scale(1.03) translateY(0)}
  to{transform:scale(1.08) translateY(-12px)}
}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,4,10,.42),rgba(2,4,10,.12) 36%,rgba(2,4,10,.42) 66%,rgba(2,4,10,.94) 100%),radial-gradient(circle at 50% 20%,rgba(34,231,255,.18),transparent 32%),radial-gradient(circle at 50% 80%,rgba(255,39,211,.16),transparent 36%)}
.neon-grid{position:absolute;inset:0;opacity:.26;background-image:linear-gradient(rgba(34,231,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,39,211,.08) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(180deg,transparent,#000 18%,#000 88%,transparent)}
.rain{position:absolute;inset:-20%;opacity:.14;background:repeating-linear-gradient(105deg,transparent 0 12px,rgba(255,255,255,.18) 13px,transparent 15px);animation:rain 1s linear infinite}
@keyframes rain{to{transform:translateY(48px)}}
.scan{position:absolute;left:0;right:0;top:0;height:100px;background:linear-gradient(180deg,transparent,rgba(34,231,255,.09),transparent);animation:scan 4s linear infinite;mix-blend-mode:screen}
@keyframes scan{0%{transform:translateY(-130px)}100%{transform:translateY(780px)}}

.splash-content {
  position:relative;z-index:5;
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  height:100vh;width:100%;padding:60px 20px 40px;
}
.top{text-align:center}
.emblem{width:96px;height:96px;margin:0 auto 16px;border:2px solid #22e7ff;background:linear-gradient(135deg,rgba(34,231,255,.16),rgba(255,39,211,.20));box-shadow:0 0 30px rgba(34,231,255,.48),inset 0 0 24px rgba(255,39,211,.18);clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:950;color:#ffd36a;text-shadow:0 0 14px rgba(255,211,106,.9)}
.emblem:after{content:"";position:absolute;bottom:17px;left:16px;right:16px;height:3px;background:#ff315d;box-shadow:0 0 14px #ff315d}
.label{font-size:10px;font-weight:950;letter-spacing:.22em;color:#22e7ff;text-transform:uppercase;text-shadow:0 0 12px rgba(34,231,255,.9)}
.title{font-size:46px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 18px rgba(34,231,255,.82),0 0 26px rgba(255,39,211,.44);line-height:.88;margin-top:8px}
.title span{color:#ffd36a;text-shadow:0 0 16px rgba(255,211,106,.85)}

.bottom{width:100%;max-width:400px;margin:0 auto}
.panel{background:rgba(3,8,16,.80);border:1px solid rgba(34,231,255,.45);padding:16px;backdrop-filter:blur(10px);clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px)}
.status{display:flex;justify-content:space-between;font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.13em;margin-bottom:9px}
.status b{color:#ffd36a}
.bar{height:14px;border:1px solid rgba(34,231,255,.42);background:rgba(0,0,0,.64);overflow:hidden;position:relative}
.bar:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12px,rgba(255,255,255,.12) 13px,transparent 14px);opacity:.55}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#22e7ff,#ff27d3,#ffd36a);box-shadow:0 0 18px rgba(34,231,255,.72);transition:width .18s ease}
.hint{text-align:center;color:#9bb4bf;font-size:11px;margin-top:10px;letter-spacing:.06em}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{height:48px;border:1px solid rgba(34,231,255,.45);background:rgba(34,231,255,.08);color:#eafdff;font-weight:950;text-transform:uppercase;letter-spacing:.08em;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);cursor:pointer;touch-action:manipulation}
.btn.main{border-color:rgba(255,211,106,.72);background:linear-gradient(90deg,#ffd36a,#ff9b36);color:#07111b}
.btn:active{transform:scale(.96)}
.version{margin-top:12px;text-align:center;color:#6d8793;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:420px){.emblem{width:82px;height:82px}.title{font-size:38px}.buttons{grid-template-columns:1fr}.splash-content{padding-top:30px}}

/* ---- Игровой контейнер ---- */
#game-container {
  position:fixed;inset:0;z-index:5;
  display:none;
  background:#000;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;
}
#game-container img {
  display:block;
  width:auto;
  height:auto;
  max-width:none;
  max-height:none;
  min-height:100vh;
  object-fit:fill;
}

/* ---- Сообщение о повороте ---- */
#rotate-msg {
  display:none;
  position:fixed;inset:0;z-index:20;
  background:rgba(0,0,0,0.92);
  color:#fff;
  font-size:24px;
  text-align:center;
  padding:40px;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
#rotate-msg .icon { font-size:60px; margin-bottom:20px; }
#rotate-msg .sub { font-size:14px; margin-top:10px; color:#999; }
</style>
</head>
<body>

<!-- Сообщение о повороте -->
<div id="rotate-msg">
  <div class="icon">📱</div>
  <div>Поверните телефон горизонтально</div>
  <div class="sub">Для игры требуется ландшафтный режим</div>
</div>

<!-- Splash -->
<div id="splash">
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="neon-grid"></div>
  <div class="rain"></div>
  <div class="scan"></div>
  <div class="splash-content">
    <div class="top">
      <div class="emblem">NR</div>
      <div class="label">Legendary Cyberpunk RPG</div>
      <div class="title">NEXUS<br><span>RONIN</span></div>
    </div>
    <div class="bottom">
      <div class="panel">
        <div class="status"><span>Синхронизация</span><b id="percent">0%</b></div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="hint" id="hint">Инициализация NR-модулей</div>
        <div class="buttons">
          <button class="btn main" id="startBtn">Начать</button>
          <button class="btn">Настройки</button>
        </div>
        <div class="version">Prototype build 0.1</div>
      </div>
    </div>
  </div>
</div>

<!-- Игровой контейнер -->
<div id="game-container">
  <img src="./assets/images/backgrounds/main_menu_bg.jpg" alt="Game Base" draggable="false">
</div>

<!-- Аудио -->
<audio id="bgMusic" loop preload="auto">
  <source src="./assets/audio/music/neon_soul.mp3" type="audio/mpeg">
</audio>

<!-- ========== ЕДИНЫЙ СКРИПТ ========== -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// ---- 1. Telegram WebApp (Fullscreen) ----
function initTelegram() {
  if (window.Telegram && window.Telegram.WebApp) {
    const webApp = window.Telegram.WebApp;
    webApp.ready();
    // Запрос полноэкранного режима (скрывает панели Telegram)
    if (webApp.requestFullscreen) {
      webApp.requestFullscreen().catch(() => {
        console.log('Fullscreen не доступен');
      });
    }
    // Разрешить вертикальные свайпы (опционально)
    if (webApp.enableVerticalSwipes) {
      webApp.enableVerticalSwipes();
    }
    console.log('Telegram fullscreen requested');
    return true;
  }
  return false;
}

// Вызов сразу после загрузки DOM
document.addEventListener('DOMContentLoaded', function() {
  initTelegram();
});

// ---- 2. Прогресс-бар ----
var percent = 0;
var fill = document.getElementById('fill');
var label = document.getElementById('percent');
var hint = document.getElementById('hint');
var hints = ['Инициализация NR-модулей','Подключение к Нексусу','Загрузка чемпионов','Синхронизация боя','Готово'];
function tick(){
  var step = Math.floor(Math.random()*4)+1;
  percent = Math.min(100, percent + step);
  fill.style.width = percent + '%';
  label.textContent = percent + '%';
  if(percent < 25) hint.textContent = hints[0];
  else if(percent < 50) hint.textContent = hints[1];
  else if(percent < 75) hint.textContent = hints[2];
  else if(percent < 100) hint.textContent = hints[3];
  else hint.textContent = hints[4];
  if(percent < 100) setTimeout(tick, 90 + Math.random()*160);
}
setTimeout(tick, 350);

// ---- 3. Музыка ----
const music = document.getElementById('bgMusic');
if (music) {
  music.volume = 0.3;
  music.load();
}

// ---- 4. Переход в игру с учётом ориентации ----
const startBtn = document.getElementById('startBtn');
const splash = document.getElementById('splash');
const gameContainer = document.getElementById('game-container');
const rotateMsg = document.getElementById('rotate-msg');

function isMobile() {
  return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent);
}

function showGame() {
  splash.classList.add('hidden');
  gameContainer.style.display = 'block';
  if (music) music.play().catch(() => {});
  startBtn.textContent = 'В игре';
  startBtn.disabled = true;
  startBtn.style.opacity = '0.5';
  rotateMsg.style.display = 'none';
  window.removeEventListener('orientationchange', checkOrientation);
  window.removeEventListener('resize', checkOrientation);
}

function checkOrientation() {
  const isPortrait = window.innerHeight > window.innerWidth;
  if (!isPortrait) {
    showGame();
  }
}

function enterGame() {
  // Ещё раз запрашиваем fullscreen (на случай, если не сработало)
  if (window.Telegram && window.Telegram.WebApp) {
    const webApp = window.Telegram.WebApp;
    if (webApp.requestFullscreen) {
      webApp.requestFullscreen().catch(() => {});
    }
  }

  if (!isMobile()) {
    showGame();
    return;
  }

  const isPortrait = window.innerHeight > window.innerWidth;
  if (isPortrait) {
    rotateMsg.style.display = 'flex';
    splash.classList.add('hidden');
    window.addEventListener('orientationchange', checkOrientation);
    window.addEventListener('resize', checkOrientation);
    if (music) music.play().catch(() => {});
    startBtn.disabled = true;
    startBtn.textContent = 'Поверните';
  } else {
    showGame();
  }
}

startBtn.addEventListener('click', enterGame);
</script>
</body>
</html>
