<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS RONIN — Loading Screen</title>
  <style>
    :root {
      var(--safe-top: max(24px, var(--tg-content-safe-area-inset-top, 24px)));
      var(--safe-bottom: max(16px, var(--tg-content-safe-area-inset-bottom, 16px)));
      --cyan: #00f0ff;
      --pink: #ff007b;
      --gold: #ffd36a;
      --dark-bg: #060913;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--dark-bg);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* === АНИМИРОВАННЫЙ ФОН СО СЛАЙДАМИ И НЕОНОВЫМ СВЕЧЕНИЕМ === */
    #bgSliderContainer {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      z-index: 1;
      background: var(--dark-bg);
    }

    .slide-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s ease-in-out, transform 8s ease;
      background-size: cover;
      background-position: center;
      transform: scale(1);
    }
    .slide-layer.active {
      opacity: 1;
      transform: scale(1.08);
    }

    /* ПЛАВАЮЩИЕ НЕОНОВЫЕ СФЕРЫ И СВЕЧЕНИЕ */
    .neon-glow-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .neon-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(45px);
      opacity: 0.55;
      animation: floatNeon 8s infinite alternate ease-in-out;
    }

    .orb-cyan {
      width: 260px;
      height: 260px;
      background: var(--cyan);
      top: 15%;
      left: 10%;
      animation-duration: 9s;
    }

    .orb-pink {
      width: 300px;
      height: 300px;
      background: var(--pink);
      bottom: 25%;
      right: 10%;
      animation-duration: 11s;
      animation-delay: -3s;
    }

    .orb-gold {
      width: 220px;
      height: 220px;
      background: var(--gold);
      top: 45%;
      left: 50%;
      animation-duration: 13s;
      animation-delay: -5s;
    }

    @keyframes floatNeon {
      0% { transform: translate(0, 0) scale(0.9); opacity: 0.35; }
      50% { transform: translate(35px, -25px) scale(1.15); opacity: 0.65; }
      100% { transform: translate(-25px, 30px) scale(0.95); opacity: 0.45; }
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(
        to bottom,
        rgba(5,9,20,0.75) 0%,
        rgba(5,9,20,0.2) 35%,
        rgba(5,9,20,0.75) 70%,
        rgba(5,9,20,0.96) 100%
      );
    }

    /* === ОСНОВНОЙ КОНТЕЙНЕР ЭКРАНА ЗАГРУЗКИ === */
    #loadingScreen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(24px, var(--tg-content-safe-area-inset-top, 24px)) 16px max(16px, var(--tg-content-safe-area-inset-bottom, 16px)) 16px;
    }

    /* =========================================================
       1. ЛОГОТИП (СВЕРХУ) И ОТЦЕНТРОВАННОЕ НАЗВАНИЕ
       ========================================================= */
    .header-logo-container {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex-shrink: 0;
    }

    .nr-badge {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(180, 0, 255, 0.35));
      border: 1px solid var(--cyan);
      color: var(--gold);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 3px;
      padding: 5px 16px;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      margin-bottom: 6px;
      text-transform: uppercase;
      display: inline-block;
    }

    .game-subtitle {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--cyan);
      font-weight: 800;
      text-shadow: 0 0 10px var(--cyan);
      text-transform: uppercase;
    }

    /* Отцентрованный блок заголовка NEXUS RONIN между шапкой и лором */
    .title-center-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .game-title {
      font-size: 46px; /* Увеличено для максимальной выразительности */
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: 3px;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-title .nexus {
      color: #ffffff;
      text-shadow: 
        1px 1px 0px var(--pink),
        -1px -1px 0px var(--cyan),
        0 0 18px rgba(255, 255, 255, 0.6);
      animation: cpGlitch 5s infinite;
    }

    .game-title .ronin {
      color: var(--gold);
      text-shadow: 
        2px 1px 0px var(--pink),
        -1px -1px 0px var(--cyan),
        0 0 25px rgba(255, 211, 106, 0.65);
      animation: cpGlitch 5s infinite 0.2s;
    }

    @keyframes cpGlitch {
      0%, 90%, 100% { transform: translate(0, 0) skewX(0deg); }
      91% { transform: translate(-3px, 1px) skewX(3deg); }
      93% { transform: translate(3px, -1px) skewX(-3deg); }
      95% { transform: translate(-1px, 2px) scale(1.02); }
      97% { transform: translate(2px, -1px); }
    }

    /* 2. Блок подсказок по лору */
    .lore-center-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 380px;
      padding: 10px 0;
    }

    .lore-slide-box {
      width: 100%;
      padding: 15px 18px;
      background: rgba(5, 9, 20, 0.85);
      border-left: 3px solid var(--cyan);
      border-right: 3px solid var(--cp-yellow);
      border-radius: 10px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15), 0 8px 25px rgba(0,0,0,0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .lore-title {
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 2px;
      font-weight: 900;
      margin-bottom: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 211, 106, 0.5);
    }
    .lore-text {
      font-size: 13.5px;
      color: #e2e8f0;
      line-height: 1.4;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }

    /* 3. Нижняя панель синхронизации */
    .loading-bottom-box {
      width: 100%;
      max-width: 400px;
      flex-shrink: 0;
    }

    .cyber-box {
      background: rgba(5, 9, 20, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.45);
      padding: 16px 18px;
      position: relative;
      clip-path: polygon(15px 0%, 100% 0%, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0% 100%, 0% 15px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.95), inset 0 0 20px rgba(0, 240, 255, 0.12);
      backdrop-filter: blur(14px);
    }

    .sync-header {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff 0%, #ff0055 50%, #FCEE0A 100%);
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.8);
      transition: width 0.25s ease;
    }

    .sync-status {
      text-align: center;
      font-size: 11.5px;
      color: #aaa;
      margin-bottom: 12px;
    }

    /* Киберпанк кнопки */
    .cyber-btn {
      width: 100%;
      padding: 13px;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    }

    .cyber-btn:active:not(:disabled) { transform: scale(0.97); }

    .btn-primary:disabled {
      background: linear-gradient(90deg, #2b3442 0%, #1e2530 100%);
      color: #7a869a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: not-allowed;
    }

    .btn-primary:not(:disabled) {
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.25), rgba(157, 0, 255, 0.3));
      color: #ffffff;
      border: 1px solid var(--cyan);
      margin-bottom: 8px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
      animation: pulseBtnCyan 1.8s infinite;
    }

    @keyframes pulseBtnCyan {
      0% { box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
      50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.85); }
      100% { box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
    }

    .btn-primary { margin-bottom: 8px; }

    .btn-secondary {
      background: rgba(10, 25, 45, 0.75);
      color: #fff;
      border: 1px solid rgba(0, 240, 255, 0.4);
    }
    .btn-secondary:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: var(--cyan);
    }

    .build-version {
      text-align: center;
      font-size: 10.5px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div id="bgSliderContainer"></div>

<div class="neon-glow-layer">
  <div class="neon-orb orb-cyan"></div>
  <div class="neon-orb orb-pink"></div>
  <div class="neon-orb orb-gold"></div>
</div>

<div class="loading-overlay"></div>

<div id="loadingScreen">
  <!-- Логотип сверху: плашка NR и подзаголовок -->
  <div class="header-logo-container">
    <div class="nr-badge">NR</div>
    <div class="game-subtitle">LEGENDARY CYBERPUNK RPG</div>
  </div>

  <!-- Отцентрованное название NEXUS RONIN между шапкой и лором -->
  <div class="title-center-box">
    <div class="game-title">
      <div class="nexus">NEXUS</div>
      <div class="ronin">RONIN</div>
    </div>
  </div>

  <!-- Подсказки по лору игры -->
  <div class="lore-center-wrapper">
    <div class="lore-slide-box">
      <div class="lore-title" id="loreTitle">⚡ СИСТЕМА: НЕО-ТОКИО</div>
      <div class="lore-text" id="loreText">Инициализация нейроинтерфейса. Ронин готовится к подключению...</div>
    </div>
  </div>

  <div class="loading-bottom-box">
    <div class="cyber-box">
      <div class="sync-header">
        <span style="color:#fff;">СИНХРОНИЗАЦИЯ</span>
        <span style="color:var(--gold);" id="syncPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="sync-status" id="syncStatusText">Загрузка нейроядер...</div>

      <button class="cyber-btn btn-primary" id="startBtn" disabled>🔒 СИНХРОНИЗАЦИЯ...</button>
      <button class="cyber-btn btn-secondary" id="settingsBtn">НАСТРОЙКИ</button>
    </div>
    <div class="build-version">PROTOTYPE BUILD 0.1</div>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram?.WebApp;

  const BACKGROUND_SLIDES = [
    {
      url: 'webapp/assets/images/backgrounds/1.jpg',
      fallback: 'radial-gradient(circle at 50% 30%, rgba(180, 0, 255, 0.45) 0%, transparent 70%), linear-gradient(to bottom, #050914, #180c2e)'
    },
    {
      url: 'webapp/assets/images/backgrounds/2.jpg',
      fallback: 'radial-gradient(circle at 70% 60%, rgba(0, 240, 255, 0.35) 0%, transparent 70%), linear-gradient(to bottom, #050914, #0a1f2e)'
    },
    {
      url: 'webapp/assets/images/backgrounds/3.jpg',
      fallback: 'radial-gradient(circle at 30% 50%, rgba(255, 0, 85, 0.35) 0%, transparent 70%), linear-gradient(to bottom, #050914, #240a1c)'
    },
    {
      url: 'webapp/assets/images/backgrounds/4.jpg',
      fallback: 'radial-gradient(circle at 50% 50%, rgba(255, 211, 106, 0.25) 0%, transparent 70%), linear-gradient(to bottom, #050914, #1a150e)'
    },
    {
      url: 'webapp/assets/images/backgrounds/5.jpg',
      fallback: 'radial-gradient(circle at 40% 30%, rgba(0, 240, 255, 0.4) 0%, transparent 70%), linear-gradient(to bottom, #050914, #0d1e2e)'
    },
    {
      url: 'webapp/assets/images/backgrounds/6.jpg',
      fallback: 'radial-gradient(circle at 50% 50%, rgba(180, 0, 255, 0.5) 0%, transparent 70%), linear-gradient(to bottom, #050914, #1e0d36)'
    }
  ];

  const LORE_DATA = [
    { title: "⚡ СИСТЕМА: НЕО-ТОКИО", text: "Мегаполис никогда не спит. Под неоновым дождём корпорации ведут тайные войны за контроль над нейросетью." },
    { title: "🧬 СЕКРЕТНЫЕ ЛАБОРАТОРИИ", text: "Биоинженерия достигла абсолюта. Кибернетические импланты и плазменное оружие создаются в недрах мега-башен." },
    { title: "⚔️ ПУТЬ РОНИНА", text: "Самурай без сузерена в киберпространстве. Только катана, быстрые рефлексы и верность собственному кодексу." },
    { title: "🥋 ПОДПОЛЬНЫЕ АРЕНЫ", text: "В подземных додзё бойцы оттачивают мастерство владения энергоклинками в поединках насмерть." },
    { title: "🌐 ТАКТИЧЕСКИЕ ЦЕНТРЫ", text: "С высоты пентхаусов хакеры Синдиката управляют потоками данных, взламывая протоколы безопасности." },
    { title: "🔮 ЯДРО NEXUS CORE", text: "Сердце вселенной. Квантовый реактор, хранящий сознание величайших воинов прошлого для Призыва." }
  ];

  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#050914');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#050914');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }

  const sliderContainer = document.getElementById('bgSliderContainer');
  const slideElements = [];

  BACKGROUND_SLIDES.forEach((item, idx) => {
    const layer = document.createElement('div');
    layer.className = `slide-layer ${idx === 0 ? 'active' : ''}`;
    layer.style.backgroundImage = `url('${item.url}'), ${item.fallback}`;
    sliderContainer.appendChild(layer);
    slideElements.push(layer);

    const variants = [
      item.url,
      item.url.replace('webapp/', './'),
      item.url.replace('webapp/', ''),
      '/' + item.url,
      item.url.replace('.jpg', '.png'),
      item.url.replace('webapp/', './').replace('.jpg', '.png'),
      item.url.replace('.jpg', '.jpeg')
    ];

    function tryLoadImage(vIndex) {
      if (vIndex >= variants.length) return;
      const img = new Image();
      img.onload = () => {
        layer.style.backgroundImage = `url('${variants[vIndex]}'), ${item.fallback}`;
      };
      img.onerror = () => tryLoadImage(vIndex + 1);
      img.src = variants[vIndex];
    }
    tryLoadImage(0);
  });

  let activeIdx = 0;
  const loreTitle = document.getElementById('loreTitle');
  const loreText = document.getElementById('loreText');

  setInterval(() => {
    slideElements[activeIdx].classList.remove('active');
    activeIdx = (activeIdx + 1) % slideElements.length;
    slideElements[activeIdx].classList.add('active');

    loreText.style.opacity = 0;
    setTimeout(() => {
      loreTitle.textContent = LORE_DATA[activeIdx].title;
      loreText.textContent = LORE_DATA[activeIdx].text;
      loreText.style.opacity = 1;
    }, 350);
  }, 4500);

  const startBtn = document.getElementById('startBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const syncPercent = document.getElementById('syncPercent');
  const progressFill = document.getElementById('progressFill');
  const syncStatusText = document.getElementById('syncStatusText');

  let currentProgress = 0;
  const syncMessages = [
    { p: 15, text: "Инициализация нейроинтерфейса..." },
    { p: 40, text: "Загрузка архитектуры Нео-Токио..." },
    { p: 65, text: "Подключение к ядру Nexus Core..." },
    { p: 85, text: "Калибровка боевых имплантов..." },
    { p: 100, text: "Синхронизация завершена" }
  ];

  const syncInterval = setInterval(() => {
    currentProgress += Math.floor(Math.random() * 6) + 3;
    if (currentProgress >= 100) {
      currentProgress = 100;
      clearInterval(syncInterval);

      startBtn.disabled = false;
      startBtn.innerHTML = "⚡ НАЧАТЬ";
      syncStatusText.textContent = "Готово к погружению";
      syncStatusText.style.color = "#00f0ff";
    }

    syncPercent.textContent = `${currentProgress}%`;
    progressFill.style.width = `${currentProgress}%`;

    for (let msg of syncMessages) {
      if (currentProgress <= msg.p && currentProgress > msg.p - 15) {
        syncStatusText.textContent = msg.text;
        break;
      }
    }
  }, 100);

  startBtn.addEventListener('click', () => {
    if (startBtn.disabled) return;

    if (tg && typeof tg.requestFullscreen === 'function') {
      try { tg.requestFullscreen(); } catch (e) { console.warn(e); }
    }

    window.location.href = 'main_menu.html';
  });

  settingsBtn.addEventListener('click', () => {
    alert("Настройки системы Nexus Ronin");
  });
</script>
</body>
</html>
